<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1a4a">
<title>ZenCut — サブスクの街（Opus案）</title>
<style>
  :root{
    --ink:#1d1230;
    --paper:rgba(255,252,248,.92);
    --line:rgba(45,25,70,.10);
    --shadow:0 10px 30px rgba(30,10,55,.28), 0 2px 6px rgba(30,10,55,.18);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#241243;overflow:hidden}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{position:fixed;inset:0;display:block;touch-action:none}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;
       padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);
       display:flex;flex-direction:column;justify-content:space-between;
       opacity:0;transition:opacity 1.1s ease .25s}
  #hud.on{opacity:1}
  .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}

  .brand{
    background:var(--paper);border-radius:18px;padding:9px 14px 10px;box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .brand b{display:block;font-size:19px;letter-spacing:.06em;line-height:1.1}
  .brand b i{font-style:normal;color:#ff6b4a}
  .brand span{display:block;font-size:11px;line-height:1.3;margin-top:3px;color:#6a5b85;letter-spacing:.04em}

  .total{
    background:linear-gradient(160deg,#ff8a5c,#ff5f7e 55%,#c94dd6);
    color:#fff;border-radius:18px;padding:9px 14px 10px;box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.45);text-align:right;min-width:126px;
  }
  .total em{display:block;font-style:normal;font-size:10px;opacity:.86;letter-spacing:.1em}
  .total b{display:block;font-size:21px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .total span{display:block;font-size:10px;opacity:.9;margin-top:2px}

  .zones{
    display:flex;gap:7px;overflow:hidden;padding:2px 0 4px;
  }
  .z{
    flex:1 1 0;min-width:0;background:var(--paper);border-radius:13px;
    padding:7px 8px 8px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);
    position:relative;overflow:hidden;
  }
  .z::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .z u{display:block;text-decoration:none;font-size:11.5px;font-weight:700;letter-spacing:.02em;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:5px}
  .z i{display:block;font-style:normal;font-size:11px;color:#7c6b96;font-variant-numeric:tabular-nums;
       padding-left:5px;margin-top:1px;white-space:nowrap}
  .z b{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;
       background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent)}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px}
  .legend{background:var(--paper);border-radius:13px;padding:6px 11px 7px;box-shadow:var(--shadow);
          border:1px solid rgba(255,255,255,.7);font-size:10.5px;color:#6a5b85;letter-spacing:.03em;
          white-space:nowrap}
  .legend .bar{display:block;height:5px;border-radius:3px;margin-top:4px;
    background:linear-gradient(90deg,#9fb0dd,#c8a8c9 45%,#f08a6a 78%,#e2503f)}
  .hint{font-size:10.5px;color:rgba(255,255,255,.72);letter-spacing:.06em;
        text-shadow:0 1px 6px rgba(0,0,0,.5);white-space:nowrap}

  #boot{position:fixed;inset:0;z-index:9;display:grid;place-items:center;
        background:linear-gradient(180deg,#3a1f5e,#241243);color:#fff8ef;
        transition:opacity .7s ease;font-size:13px;letter-spacing:.14em}
  #boot.gone{opacity:0;pointer-events:none}
  #err{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;display:none;
       background:#2a1140;color:#ffd9d0;border:1px solid #ff7a5c;border-radius:12px;
       padding:10px 12px;font-size:11px;line-height:1.5;white-space:pre-wrap}

  @media (max-width:640px){
    .zones{flex-wrap:wrap}
    .z{flex:1 1 30%}
    .brand b{font-size:17px}
    .total b{font-size:19px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <div class="row">
    <div class="brand"><b>Zen<i>Cut</i></b><span>サブスクの街　俯瞰ビュー</span></div>
    <div class="total"><em>MONTHLY</em><b id="totalYen">¥0</b><span id="totalSub">契約 0 / 未契約 0</span></div>
  </div>
  <div>
    <div class="zones" id="zones"></div>
    <div class="foot">
      <div class="legend">地面の熱＝その街の月額合計<span class="bar"></span></div>
      <div class="hint">ドラッグで街をまわす</div>
    </div>
  </div>
</div>

<div id="boot">BUILDING THE CITY…</div>
<div id="err"></div>

<script src="./three.min.js"></script>
<script>
(function () {
  "use strict";

  var errBox = document.getElementById('err');
  function fail(e) {
    errBox.style.display = 'block';
    errBox.textContent = 'render error: ' + (e && e.message ? e.message : e);
  }

  if (!window.THREE) { fail(new Error('three.min.js が読み込めませんでした')); return; }

  /* =======================================================================
     0. DATA
     ======================================================================= */

  // p = 月額, m = 継続月数, sub=契約中
  var DISTRICTS = [
    { name:'AI街',    accent:'#ff6f52', deg:  30, apps:[
      { n:'CHATTY',   e:'🤖', p:3900, m:24, c:'#ffb02e' },
      { n:'BRAINIA',  e:'🧠', p:3000, m:12, c:'#b478f0' },
      { n:'PIXGEN',   e:'🎨', p:1480, m: 6, c:'#ff7fae' },
      { n:'VOICEMO' }, { n:'CODEPAL' }
    ]},
    { name:'動画街',  accent:'#f2564f', deg:  90, apps:[
      { n:'MOOVA',    e:'🎬', p:1190, m:36, c:'#f0524b' },
      { n:'CINEPOP',  e:'🍿', p: 990, m:14, c:'#ff9052' },
      { n:'PRIMELY' }, { n:'TUBEMAX' }, { n:'ANIMEBOX' }, { n:'SHORTIN' }
    ]},
    { name:'音楽街',  accent:'#4b90f7', deg: 150, apps:[
      { n:'BEATLY',   e:'🎵', p: 980, m:24, c:'#3e82f7' },
      { n:'TUNEBOX',  e:'🎧', p:1080, m: 8, c:'#33c9d8' },
      { n:'MELODIN' }, { n:'PODCASTLE' }
    ]},
    { name:'からだ街',accent:'#1fb88a', deg: 210, apps:[
      { n:'GYMO',     e:'🏋️', p:7800, m:18, c:'#22c08f' },
      { n:'FITMORE' }, { n:'SLEEPLY' }
    ]},
    { name:'ゲーム街',accent:'#3fbf6a', deg: 270, apps:[
      { n:'GEMPOP',   e:'💎', p:1280, m:30, c:'#46c46f' },
      { n:'PLAYPASS' }, { n:'CLOUDPLAY' }
    ]},
    { name:'学び街',  accent:'#b06be8', deg: 330, apps:[
      { n:'LINGOZA',  e:'📖', p: 480, m:12, c:'#a95ce8' },
      { n:'SKILLPON' }, { n:'BRAINGO' }
    ]}
  ];

  var MAX_SPEND = 0, GRAND = 0, nSub = 0, nFree = 0;
  DISTRICTS.forEach(function (d) {
    d.total = 0;
    d.apps.forEach(function (a) {
      a.sub = !!a.p;
      if (a.sub) { d.total += a.p; a.spend = a.p * a.m; if (a.spend > MAX_SPEND) MAX_SPEND = a.spend; nSub++; }
      else { nFree++; }
    });
    GRAND += d.total;
  });
  var MAX_TOTAL = DISTRICTS.reduce(function (m, d) { return Math.max(m, d.total); }, 0);
  DISTRICTS.forEach(function (d) { d.heat = Math.pow(d.total / MAX_TOTAL, 0.7); });

  function yen(v) { return '¥' + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  /* ---- HUD fill ---- */
  document.getElementById('totalYen').textContent = yen(GRAND);
  document.getElementById('totalSub').textContent = '契約 ' + nSub + ' / 未契約 ' + nFree;
  var zonesEl = document.getElementById('zones');
  DISTRICTS.slice().sort(function (a, b) { return b.total - a.total; }).forEach(function (d) {
    var el = document.createElement('div');
    el.className = 'z';
    el.style.setProperty('--c', d.accent);
    el.innerHTML = '<b></b><u></u><i></i>';
    el.querySelector('u').textContent = d.name;
    el.querySelector('i').textContent = yen(d.total) + '/月';
    zonesEl.appendChild(el);
  });

  /* =======================================================================
     1. HELPERS
     ======================================================================= */

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(20260808);
  function rr(a, b) { return a + (b - a) * rnd(); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  var TAU = Math.PI * 2, D2R = Math.PI / 180;

  function cv(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }
  function tex(canvas, srgb) {
    var t = new THREE.CanvasTexture(canvas);
    if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }
  function rpath(ctx, x, y, w, h, r) {
    r = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  var EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color",sans-serif';
  var TEXT_FONT  = '"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif';

  function mix(hexA, hexB, t) {
    var a = new THREE.Color(hexA), b = new THREE.Color(hexB);
    return a.lerp(b, t);
  }

  /* =======================================================================
     2. RENDERER / SCENE / CAMERA
     ======================================================================= */

  var canvas = document.getElementById('stage');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
  } catch (e) { fail(e); return; }

  var DPR_CAP = 2;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.02;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var isSmall = Math.min(window.innerWidth, window.innerHeight) < 700;
  var SHADOW_SIZE = isSmall ? 1024 : 2048;

  var scene = new THREE.Scene();
  var FOG_COLOR = 0x9b6a94;
  scene.fog = new THREE.FogExp2(FOG_COLOR, 0.0018);

  var camera = new THREE.PerspectiveCamera(30, 1, 1, 900);

  /* ---- sky dome ---- */
  (function () {
    var c = cv(4, 512), g = c.getContext('2d');
    var grd = g.createLinearGradient(0, 0, 0, 512);
    grd.addColorStop(0.00, '#1b1040');
    grd.addColorStop(0.24, '#3b1f63');
    grd.addColorStop(0.46, '#7b3a79');
    grd.addColorStop(0.62, '#c25c7a');
    grd.addColorStop(0.74, '#f0865f');
    grd.addColorStop(0.83, '#ffb066');
    grd.addColorStop(0.92, '#ffd39a');
    grd.addColorStop(1.00, '#f3b6a0');
    g.fillStyle = grd; g.fillRect(0, 0, 4, 512);
    var t = tex(c);
    var dome = new THREE.Mesh(
      new THREE.SphereGeometry(420, 40, 24),
      new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide, fog: false, depthWrite: false })
    );
    dome.renderOrder = -10;
    scene.add(dome);
  })();

  /* ---- stars ---- */
  var starMat = null;
  (function () {
    var N = 320, pos = new Float32Array(N * 3);
    for (var i = 0; i < N; i++) {
      var th = rnd() * TAU, ph = Math.acos(rr(0.28, 0.98));
      var R = 390;
      pos[i * 3]     = R * Math.sin(ph) * Math.cos(th);
      pos[i * 3 + 1] = R * Math.cos(ph);
      pos[i * 3 + 2] = R * Math.sin(ph) * Math.sin(th);
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    var dot = cv(32, 32), dc = dot.getContext('2d');
    var rg = dc.createRadialGradient(16, 16, 0, 16, 16, 16);
    rg.addColorStop(0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.35, 'rgba(255,238,220,.7)');
    rg.addColorStop(1, 'rgba(255,220,200,0)');
    dc.fillStyle = rg; dc.fillRect(0, 0, 32, 32);
    var m = new THREE.PointsMaterial({
      size: 3.2, sizeAttenuation: false, map: tex(dot), transparent: true,
      depthWrite: false, blending: THREE.AdditiveBlending, fog: false, opacity: 0.85
    });
    var p = new THREE.Points(g, m);
    p.renderOrder = -9;
    scene.add(p);
    starMat = m;
  })();

  /* =======================================================================
     3. LIGHTS
     ======================================================================= */

  var hemi = new THREE.HemisphereLight(0xffc9a3, 0x4a2f6e, 1.55);
  scene.add(hemi);

  var sun = new THREE.DirectionalLight(0xffd0a0, 3.1);
  sun.position.set(-46, 44, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(SHADOW_SIZE, SHADOW_SIZE);
  sun.shadow.camera.left = -62; sun.shadow.camera.right = 62;
  sun.shadow.camera.top = 72; sun.shadow.camera.bottom = -58;
  sun.shadow.camera.near = 8; sun.shadow.camera.far = 230;
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 0.035;
  scene.add(sun);
  scene.add(sun.target);
  sun.target.position.set(0, 2, 0);

  // 逆光の紫リム（夕暮れのそれっぽさ）
  var rim = new THREE.DirectionalLight(0x8f7bff, 0.9);
  rim.position.set(44, 20, -40);
  scene.add(rim);

  var plazaLight = new THREE.PointLight(0xffd066, 260, 62, 2);
  plazaLight.position.set(0, 9, 0);
  scene.add(plazaLight);

  /* =======================================================================
     4. SHARED TEXTURES / MATERIALS
     ======================================================================= */

  // --- glow sprite ---
  var GLOW_TEX = (function () {
    var c = cv(128, 128), g = c.getContext('2d');
    var rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0.00, 'rgba(255,255,255,.95)');
    rg.addColorStop(0.18, 'rgba(255,236,190,.72)');
    rg.addColorStop(0.45, 'rgba(255,180,120,.26)');
    rg.addColorStop(1.00, 'rgba(255,150,100,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
    return tex(c);
  })();
  function glow(size, color, opacity) {
    var s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: GLOW_TEX, color: color, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, fog: false, opacity: opacity == null ? 0.9 : opacity
    }));
    s.scale.set(size, size, 1);
    return s;
  }

  // --- 地面に寝かせる熱のにじみ（Spriteだと立ってしまうので板で） ---
  var HEAT_TEX = (function () {
    var c = cv(128, 128), g = c.getContext('2d');
    var rg = g.createRadialGradient(64, 64, 6, 64, 64, 64);
    rg.addColorStop(0.00, 'rgba(255,120,60,.85)');
    rg.addColorStop(0.42, 'rgba(255,80,40,.42)');
    rg.addColorStop(0.78, 'rgba(220,60,40,.12)');
    rg.addColorStop(1.00, 'rgba(200,50,40,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
    return tex(c);
  })();
  function heatDisc(size, opacity) {
    var m = new THREE.Mesh(
      new THREE.PlaneGeometry(size, size),
      new THREE.MeshBasicMaterial({
        map: HEAT_TEX, transparent: true, depthWrite: false, fog: false,
        blending: THREE.AdditiveBlending, opacity: opacity
      })
    );
    m.rotation.x = -Math.PI / 2;
    m.renderOrder = 2;
    return m;
  }

  // --- window texture cache (map + emissiveMap) ---
  var winCache = {};
  function windowTex(bodyHex, warmHex) {
    var key = bodyHex + '|' + warmHex;
    if (winCache[key]) return winCache[key];
    var S = 128, cols = 3, rows = 3;
    var a = cv(S, S), ac = a.getContext('2d');   // map
    var b = cv(S, S), bc = b.getContext('2d');   // emissiveMap
    ac.fillStyle = bodyHex; ac.fillRect(0, 0, S, S);
    // 上下の帯（階の境目）でロウポリ感
    var band = new THREE.Color(bodyHex).multiplyScalar(0.82).getStyle();
    ac.fillStyle = band; ac.fillRect(0, 0, S, 6); ac.fillRect(0, S - 6, S, 6);
    bc.fillStyle = '#000'; bc.fillRect(0, 0, S, S);
    var hsh = 0, ks = key;
    for (var q = 0; q < ks.length; q++) hsh = (hsh * 131 + ks.charCodeAt(q)) | 0;
    var pad = 14, gw = (S - pad * 2) / cols, seed = mulberry32(hsh);
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++) {
        var px = pad + x * gw + gw * 0.13, py = pad + y * gw + gw * 0.16;
        var pw = gw * 0.74, ph = gw * 0.60;
        var lit = seed() > 0.22;
        ac.fillStyle = lit ? warmHex : 'rgba(20,14,34,.55)';
        rpath(ac, px, py, pw, ph, 4); ac.fill();
        if (lit) {
          var j = 0.55 + seed() * 0.45;
          bc.fillStyle = 'rgba(' + Math.round(255 * j) + ',' + Math.round(214 * j) + ',' + Math.round(150 * j) + ',1)';
          rpath(bc, px, py, pw, ph, 4); bc.fill();
        }
      }
    }
    var out = { map: tex(a), emi: tex(b) };
    out.map.wrapS = out.map.wrapT = THREE.RepeatWrapping;
    out.emi.wrapS = out.emi.wrapT = THREE.RepeatWrapping;
    winCache[key] = out;
    return out;
  }

  // --- sign plaque (emoji) ---
  function plaqueTex(emoji, hex) {
    var S = 256, c = cv(S, S), g = c.getContext('2d');
    g.clearRect(0, 0, S, S);
    var base = new THREE.Color(hex);
    g.fillStyle = base.clone().multiplyScalar(1.12).getStyle();
    rpath(g, 8, 8, S - 16, S - 16, 46); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 7;
    rpath(g, 15, 15, S - 30, S - 30, 40); g.stroke();
    // 内側の白丸（アイコンの座）
    g.fillStyle = 'rgba(255,255,255,.14)';
    g.beginPath(); g.arc(S / 2, S / 2, S * 0.34, 0, TAU); g.fill();
    g.font = '146px ' + EMOJI_FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emoji, S / 2, S / 2 + 8);
    return tex(c);
  }

  // --- name band ---
  function bandTex(name, hex) {
    var W = 512, H = 160, c = cv(W, H), g = c.getContext('2d');
    var base = new THREE.Color(hex);
    g.fillStyle = base.clone().multiplyScalar(0.94).getStyle();
    rpath(g, 6, 10, W - 12, H - 20, 30); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 6;
    rpath(g, 12, 16, W - 24, H - 32, 26); g.stroke();
    g.fillStyle = '#fffdf7';
    g.font = '700 78px ' + TEXT_FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var w = g.measureText(name).width, sc = Math.min(1, (W - 74) / w);
    g.save(); g.translate(W / 2, H / 2 + 2); g.scale(sc, 1);
    g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 8; g.shadowOffsetY = 3;
    g.fillText(name, 0, 0); g.restore();
    return tex(c);
  }

  // --- floating district label ---
  function labelSprite(d) {
    var W = 640, H = 260, c = cv(W, H), g = c.getContext('2d');
    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(28,16,46,.80)';
    rpath(g, 8, 8, W - 16, H - 16, 62); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.24)'; g.lineWidth = 4;
    rpath(g, 12, 12, W - 24, H - 24, 58); g.stroke();
    // 左のアクセントドット
    g.fillStyle = d.accent;
    g.beginPath(); g.arc(72, H / 2, 26, 0, TAU); g.fill();
    g.shadowColor = d.accent; g.shadowBlur = 26;
    g.beginPath(); g.arc(72, H / 2, 26, 0, TAU); g.fill();
    g.shadowBlur = 0;

    }
  });

  /* ---- 雲 ---- */
  var clouds = [];
  (function () {
    var cm = new THREE.MeshStandardMaterial({ color: '#ffd7e0', roughness: 1, flatShading: true, emissive: 0x4a2a52, emissiveIntensity: 0.35 });
    for (var i = 0; i < 7; i++) {
      var g = new THREE.Group();
      var n = 3 + Math.floor(rnd() * 2);
      for (var k = 0; k < n; k++) {
        var b = new THREE.Mesh(new THREE.IcosahedronGeometry(rr(1.5, 2.8), 0), cm);
        b.position.set(rr(-3.2, 3.2), rr(-0.4, 0.5), rr(-1.1, 1.1));
        b.scale.y = rr(0.42, 0.62);
        g.add(b);
      }
      var R = rr(38, 66), a = rnd() * TAU;
      g.position.set(Math.sin(a) * R, rr(21, 33), Math.cos(a) * R);
      g.scale.setScalar(rr(0.9, 1.7));
      scene.add(g);
      clouds.push({ o: g, a: a, R: R, sp: rr(0.010, 0.024), yb: g.position.y });
    }
  })();

  /* ---- 鳥 ---- */
  var birds = [];
  (function () {
    var bm = new THREE.MeshStandardMaterial({ color: '#2e2140', roughness: 1, emissive: 0x120a20 });
    var wg = new THREE.BoxGeometry(1.15, 0.07, 0.3);
    for (var i = 0; i < 5; i++) {
      var g = new THREE.Group();
      var l = new THREE.Mesh(wg, bm); l.position.x = -0.56; g.add(l);
      var r = new THREE.Mesh(wg, bm); r.position.x = 0.56; g.add(r);
      var R = rr(30, 52), h = rr(15, 26);
      scene.add(g);
      birds.push({ o: g, L: l, R: r, rad: R, y: h, a: rnd() * TAU, sp: rr(0.10, 0.17), ph: rnd() * TAU });
    }
  })();

  /* ---- 請求書 ---- */
  var bills = [];
  (function () {
    var hot = DISTRICTS.filter(function (d) { return d.heat > 0.35; });
    for (var i = 0; i < 16; i++) {
      var s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: BILL_TEX, transparent: true, depthWrite: false, opacity: 0, fog: false
      }));
      s.scale.set(1.05, 1.32, 1);
      scene.add(s);
      bills.push({ o: s, d: hot[i % hot.length], t: rnd() * 6, sp: rr(0.10, 0.19), ox: 0, oz: 0, sw: rr(0.6, 1.5) });
    }
  })();

  /* ---- コイン ---- */
  var coins = [];
  (function () {
    var cg = new THREE.CylinderGeometry(0.46, 0.46, 0.12, 14);
    var cm = new THREE.MeshStandardMaterial({
      color: '#ffcc4d', metalness: 0.85, roughness: 0.22,
      emissive: 0xffa22a, emissiveIntensity: 0.7, flatShading: true
    });
    for (var i = 0; i < 9; i++) {
      var m = new THREE.Mesh(cg, cm);
      m.rotation.x = Math.PI / 2;
      plaza.add(m);
      coins.push({ o: m, a: i / 9 * TAU, r: rr(3.2, 4.6), y: rr(3.4, 8.2), sp: rr(0.28, 0.5) });
    }
  })();

  /* ---- 水面 ---- */
  var water, waterPos, waterBase;
  (function () {
    var g = new THREE.PlaneGeometry(460, 460, 48, 48);
    g.rotateX(-Math.PI / 2);
    var m = new THREE.MeshStandardMaterial({
      color: '#2b3a78', roughness: 0.22, metalness: 0.35, flatShading: true
    });
    water = new THREE.Mesh(g, m);
    water.position.y = -1.4;
    scene.add(water);
    waterPos = g.attributes.position;
    waterBase = new Float32Array(waterPos.count * 2);
    for (var i = 0; i < waterPos.count; i++) {
      waterBase[i * 2] = waterPos.getX(i);
      waterBase[i * 2 + 1] = waterPos.getZ(i);
    }
  })();

  /* =======================================================================
     6. CAMERA RIG
     ======================================================================= */

  var BASE_AZ = 40 * D2R, BASE_EL = 50 * D2R;
  var DIST = 118;
  var dragAz = 0, dragEl = 0, dragging = false, lastX = 0, lastY = 0, dragVel = 0;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function onDown(e) {
    dragging = true;
    var p = e.touches ? e.touches[0] : e;
    lastX = p.clientX; lastY = p.clientY;
  }
  function onMove(e) {
    if (!dragging) return;
    var p = e.touches ? e.touches[0] : e;
    dragAz -= (p.clientX - lastX) * 0.005;
    dragEl = clamp(dragEl + (p.clientY - lastY) * 0.0035, -0.30, 0.32);
    lastX = p.clientX; lastY = p.clientY;
    if (e.cancelable) e.preventDefault();
  }
  function onUp() { dragging = false; }
  canvas.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  var camTarget = new THREE.Vector3(0, 7, 0);

  function resize() {
    var w = Math.max(1, window.innerWidth || 0), h = Math.max(1, window.innerHeight || 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, DPR_CAP));
    renderer.setSize(w, h);
    var aspect = w / h;
    camera.aspect = aspect;
    // 縦画面ほど「引き切らず」少し寄せて街を大きく見せる
    var fitR = 41 - 9 * clamp((1.15 - aspect) / 0.7, 0, 1);
    var halfH = Math.asin(clamp(fitR / DIST, 0.05, 0.9));
    var tanV = Math.tan(halfH) / aspect;
    camera.fov = clamp(2 * Math.atan(tanV) / D2R, 17, 84);
    camTarget.set(0, aspect < 0.85 ? 11.5 : 7.2, 0);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* =======================================================================
     7. ANIMATE
     ======================================================================= */

  var clock = new THREE.Clock();
  var camAz = BASE_AZ;
  var goldPulse = 0;

  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    // --- camera ---
    var swing = reduce ? 0 : Math.sin(t * 0.085) * 0.175 + Math.sin(t * 0.031) * 0.06;
    var lift = reduce ? 0 : Math.sin(t * 0.061) * 0.035;
    camAz = BASE_AZ + swing + dragAz;
    var el = clamp(BASE_EL + lift + dragEl, 0.30, 1.32);
    var d = DIST + (reduce ? 0 : Math.sin(t * 0.047) * 5.0);
    camera.position.set(
      Math.sin(camAz) * Math.cos(el) * d,
      Math.sin(el) * d + camTarget.y * 0.35,
      Math.cos(camAz) * Math.cos(el) * d
    );
    camera.lookAt(camTarget);

    // --- 看板をカメラ向きに ---
    for (var i = 0; i < billboards.length; i++) billboards[i].rotation.y = camAz;

    // --- ラベルのふわふわ ---
    for (var li = 0; li < labels.length; li++) {
      labels[li].position.y = DISTRICTS[li]._labY + Math.sin(t * 0.9 + li * 1.3) * 0.28;
    }

    // --- 金の木 ---
    goldPulse = 0.55 + Math.sin(t * 1.6) * 0.28;
    if (goldTip) goldTip.material.emissiveIntensity = 1.9 + Math.sin(t * 2.2) * 0.7;
    goldTree.rotation.y = t * 0.06;
    plazaLight.intensity = 240 + Math.sin(t * 1.7) * 55;

    // --- コイン ---
    for (var ci = 0; ci < coins.length; ci++) {
      var c = coins[ci];
      c.a += c.sp * dt;
      c.o.position.set(Math.sin(c.a) * c.r, PLATE_TOP + c.y + Math.sin(t * 1.1 + ci) * 0.35, Math.cos(c.a) * c.r);
      c.o.rotation.z = t * 1.6 + ci;
    }

    // --- 車 ---
    for (var k = 0; k < cars.length; k++) {
      var ca = cars[k];
      ca.a += ca.sp * dt;
      ca.o.position.set(Math.sin(ca.a) * ca.r, ca.y, Math.cos(ca.a) * ca.r);
      ca.o.rotation.y = ca.a + (ca.sp > 0 ? 0 : Math.PI);
    }

    // --- 雲 ---
    for (var cl = 0; cl < clouds.length; cl++) {
      var cd = clouds[cl];
      cd.a += cd.sp * dt;
      cd.o.position.set(Math.sin(cd.a) * cd.R, cd.yb + Math.sin(t * 0.25 + cl) * 0.9, Math.cos(cd.a) * cd.R);
      cd.o.rotation.y = -cd.a;
    }

    // --- 鳥 ---
    for (var bi = 0; bi < birds.length; bi++) {
      var b = birds[bi];
      b.a += b.sp * dt;
      b.o.position.set(Math.sin(b.a) * b.rad, b.y + Math.sin(t * 0.5 + bi) * 1.4, Math.cos(b.a) * b.rad);
      b.o.rotation.y = -b.a;
      var flap = Math.sin(t * 7 + b.ph) * 0.55;
      b.L.rotation.z = flap; b.R.rotation.z = -flap;
    }

    // --- 請求書 ---
    for (var q = 0; q < bills.length; q++) {
      var bl = bills[q];
      bl.t += dt * bl.sp;
      if (bl.t > 1) {
        bl.t = 0;
        var a = rnd() * TAU, r2 = rnd() * 6.5;
        bl.ox = bl.d._cx + Math.sin(a) * r2;
        bl.oz = bl.d._cz + Math.cos(a) * r2;
        bl.sw = rr(0.6, 1.6);
      }
      var pr = bl.t;
      bl.o.position.set(
        bl.ox + Math.sin(pr * 7 * bl.sw) * 1.5,
        PLATE_TOP + 1.5 + pr * 17,
        bl.oz + Math.cos(pr * 5 * bl.sw) * 1.5
      );
      bl.o.material.rotation = Math.sin(pr * 9) * 0.6;
      bl.o.material.opacity = Math.sin(Math.min(1, pr) * Math.PI) * 0.9;
    }

    // --- 点滅アンテナ ---
    for (var di2 = 0; di2 < DISTRICTS.length; di2++) {
      var apps = DISTRICTS[di2].apps;
      for (var ai = 0; ai < apps.length; ai++) {
        if (apps[ai]._blink) {
          apps[ai]._blink.material.emissiveIntensity = 1.6 + (Math.sin(t * 3 + ai * 2 + di2) > 0.6 ? 2.6 : 0);
        }
      }
    }

    // --- 水面 ---
    for (var w = 0; w < waterPos.count; w++) {
      var wx = waterBase[w * 2], wz = waterBase[w * 2 + 1];
      waterPos.setY(w, Math.sin(wx * 0.075 + t * 0.75) * 0.30 + Math.cos(wz * 0.055 - t * 0.55) * 0.34);
    }
    waterPos.needsUpdate = true;

    // --- 星のまたたき ---
    if (starMat) starMat.opacity = 0.72 + Math.sin(t * 0.8) * 0.14;

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  try {
    renderer.render(scene, camera);
  } catch (e) { fail(e); }

  requestAnimationFrame(frame);

  // --- boot fade ---
  setTimeout(function () {
    document.getElementById('boot').classList.add('gone');
    document.getElementById('hud').classList.add('on');
  }, 220);

  window.addEventListener('error', function (ev) { fail(ev.error || ev.message); });
})();
</script>
</body>
</html>
