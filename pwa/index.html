<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#4aa3e8">
  <title>ZenCut</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      --ink: #fff8df;
      --gold: #ffd34d;
      --glass: rgba(20, 14, 62, .78);
      /* SimCity2000風パネル配色 */
      --steel-hi: #f2f4fa;
      --steel-lo: #4e5364;
      --steel-face: linear-gradient(#c6cad7, #a3a9ba);
      --steel-outline: #171a24;
      --titlebar: linear-gradient(#4a7de0, #22408e);
      --lcd-bg: #071a0c;
      --lcd-green: #56ff8d;
      --panel-text: #23283a;
      --mono: "Courier New", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #4aa3e8; }
    body { color: var(--ink); touch-action: none; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    /* 共通: SimCity風ウィンドウのタイトルバー */
    .sc-titlebar {
      display: block; margin: 0; padding: 6px 10px 5px;
      background: var(--titlebar); color: #fff;
      font-size: .82rem; font-weight: 1000; letter-spacing: .14em; text-align: left;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, .45);
      border-bottom: 2px solid var(--steel-lo); box-shadow: inset 0 1px rgba(255, 255, 255, .35);
    }
    #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #stage { background: linear-gradient(#3f97e0 0%, #74bdf0 38%, #c3e6fb 62%, #e8f6d8 74%, #6fae58 100%); }

    #title-screen {
      position: fixed; z-index: 20; inset: 0; display: grid; place-items: end center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(44px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(17, 11, 56, .05), rgba(17, 11, 56, .15) 45%, rgba(12, 9, 42, .9)),
                  url('./assets/title.png') center 44% / cover no-repeat;
      transition: opacity .55s ease, visibility .55s;
    }
    #title-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .title-card { width: min(100%, 430px); text-align: center; filter: drop-shadow(0 5px 10px #171342); }
    .logo { margin: 0; font-size: clamp(3.8rem, 16vw, 6.2rem); font-weight: 1000; letter-spacing: -.08em; line-height: .92; }
    .logo span { color: var(--gold); }
    .tagline { margin: 12px 0 22px; font-weight: 800; letter-spacing: .12em; text-shadow: 0 2px 8px #171342; }
    #start {
      width: min(88%, 330px); min-height: 64px; cursor: pointer;
      border: 4px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      border-radius: 2px; color: #1a3a1e; background: linear-gradient(#b6e8a8, #6fc45f);
      font-size: 1.25rem; font-weight: 1000; letter-spacing: .1em;
      box-shadow: 0 0 0 2px var(--steel-outline), 0 8px 0 rgba(10, 12, 24, .55), 0 14px 30px rgba(0,0,0,.35);
      text-shadow: 1px 1px 0 rgba(255, 255, 255, .45);
    }
    #start:active {
      transform: translateY(5px);
      border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      box-shadow: 0 0 0 2px var(--steel-outline), 0 3px 0 rgba(10, 12, 24, .55);
    }

    #opening {
      position: fixed; z-index: 19; inset: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 42%, rgba(140,196,240,.96), rgba(58,124,190,.98) 66%);
      opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s, background .45s;
    }
    #opening.visible { opacity: 1; visibility: visible; pointer-events: auto; }
    #opening.building { background: rgba(120,180,235,.08); }
    .scan-card {
      width: min(88vw, 390px); padding: 0 0 20px; text-align: center;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      background: var(--steel-face); border-radius: 2px;
      box-shadow: 0 0 0 2px var(--steel-outline), 0 18px 55px rgba(0,0,0,.42);
      transition: transform .45s ease, opacity .45s;
    }
    #opening.building .scan-card { transform: translateY(31vh) scale(.84); opacity: .92; }
    #scan-message { margin: 16px 14px 0; color: var(--panel-text); font-size: clamp(1.05rem, 4.6vw, 1.4rem); font-weight: 1000; }
    #mail-count {
      margin: 14px auto 6px; padding: 6px 20px; width: max-content; min-width: 130px;
      font-size: 2.4rem; line-height: 1.15;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); color: var(--lcd-green);
      font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums;
      text-shadow: 0 0 7px rgba(86, 255, 141, .55);
    }
    #mail-label { margin: 0; color: #3c4257; font-size: .84rem; font-weight: 700; }
    #skip-note { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); color: rgba(255,255,255,.9); text-shadow: 0 1px 3px rgba(20,40,70,.5); font-size: .72rem; }

    #hud {
      position: fixed; z-index: 5; top: 0; left: 0; right: 0; pointer-events: none;
      padding: max(10px, env(safe-area-inset-top)) 12px 0;
      display: flex; justify-content: center;
    }
    .counter {
      min-width: min(94vw, 390px); padding: 7px 10px 7px; text-align: center;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      background: var(--steel-face); border-radius: 2px;
      box-shadow: 0 0 0 2px var(--steel-outline), 0 7px 25px rgba(5,4,30,.4);
      color: var(--panel-text);
    }
    .counter-main {
      display: block; padding: 4px 10px; font-size: clamp(.88rem, 3.8vw, 1.06rem); font-weight: 700;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); color: var(--lcd-green);
      font-family: var(--mono); text-shadow: 0 0 7px rgba(86, 255, 141, .5);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #contract-total { font-size: 1.08em; font-weight: 700; font-variant-numeric: tabular-nums; }
    #monthly { display: inline-block; color: #ffe066; text-shadow: 0 0 7px rgba(255, 224, 102, .6); font-size: 1.22em; font-weight: 700; font-variant-numeric: tabular-nums; }
    #monthly.bump { animation: bump .55s ease; }
    .counter-sub {
      display: block; margin-top: 4px; padding: 3px 10px; font-size: .74rem; letter-spacing: .08em;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); color: #ffe066;
      font-family: var(--mono); font-weight: 700; text-shadow: 0 0 6px rgba(255, 224, 102, .5);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }

    #hint {
      position: fixed; z-index: 5; top: max(96px, calc(env(safe-area-inset-top) + 88px)); left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 90vw; padding: 5px 12px; border-radius: 2px;
      border: 2px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      background: linear-gradient(#fdf6cf, #f0e3a0); box-shadow: 0 0 0 1px var(--steel-outline), 0 4px 12px rgba(5,4,30,.35);
      color: #4a3d14; font-size: .72rem; font-weight: 700; text-align: center; pointer-events: none; transition: opacity .3s;
    }
    #motion-status { color: #a1541c; }

    #sheet {
      position: fixed; z-index: 8; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom));
      margin: auto; width: min(calc(100% - 20px), 520px); padding: 0 0 12px;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      border-radius: 2px; background: var(--steel-face);
      box-shadow: 0 0 0 2px var(--steel-outline), 0 12px 40px rgba(4,3,27,.48);
      text-align: center; transform: translateY(calc(100% + 28px)); opacity: 0; transition: .28s cubic-bezier(.2,.9,.2,1.1); pointer-events: none;
    }
    #sheet.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
    #sheet-title {
      margin: 0 0 10px; padding: 7px 12px 6px; text-align: left;
      background: var(--titlebar); color: #fff; font-size: 1.02rem; font-weight: 1000; letter-spacing: .06em;
      text-shadow: 1px 1px 0 rgba(0,0,0,.45); border-bottom: 2px solid var(--steel-lo);
      box-shadow: inset 0 1px rgba(255,255,255,.35);
    }
    #sheet-detail { margin: 0 14px 10px; color: #343a4e; font-size: .91rem; font-weight: 700; }
    #sheet-action {
      margin: 10px 14px 2px; padding: 6px 8px; color: #ffe066; font-size: 1rem; font-weight: 700;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); font-family: var(--mono); text-shadow: 0 0 7px rgba(255, 224, 102, .55);
      animation: pulse 1s ease-in-out infinite;
    }
    #sheet-action[hidden], #sheet-choices[hidden], #cancel-keep[hidden] { display: none; }
    #sheet-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 14px; }
    .choice-button, #cancel-keep {
      min-height: 52px; border-radius: 2px; cursor: pointer; touch-action: manipulation;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      box-shadow: 0 0 0 1px var(--steel-outline), 0 3px 0 rgba(10,12,24,.4);
      font-weight: 1000; text-shadow: 1px 1px 0 rgba(255,255,255,.4);
    }
    .choice-button:active, #cancel-keep:active {
      transform: translateY(2px);
      border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      box-shadow: 0 0 0 1px var(--steel-outline), 0 1px 0 rgba(10,12,24,.4);
    }
    #keep-button { background: linear-gradient(#b6e8a8, #6fc45f); color: #1a3a1e; }
    #destroy-button { background: linear-gradient(#f6b48c, #e05a3a); color: #4a130a; }
    #cancel-keep { width: calc(100% - 28px); margin: 10px 14px 0; background: var(--steel-face); color: var(--panel-text); }

    #flash { position: fixed; z-index: 7; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle, #fffde0, #ffbf24 28%, #ff4d00 58%, transparent 73%); mix-blend-mode: screen; }
    #flash.go { animation: flash .44s ease-out; }
    #cancel-stamp {
      position: fixed; z-index: 14; top: 44%; left: 50%; padding: 8px 18px; border: 7px double #e52c35; border-radius: 12px;
      color: #e52c35; background: rgba(255,245,221,.9); font-size: clamp(2.8rem, 15vw, 5.8rem); font-weight: 1000;
      letter-spacing: .08em; line-height: 1; opacity: 0; pointer-events: none; transform: translate(-50%, -50%) rotate(-12deg) scale(2.4);
      text-shadow: 2px 2px 0 rgba(255,255,255,.8); box-shadow: 0 4px 18px rgba(75,0,12,.4);
    }
    #cancel-stamp.go { animation: stamp-in .8s cubic-bezier(.15,.85,.2,1); }

    #celebration {
      position: fixed; z-index: 15; inset: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 56%, rgba(255,225,120,.4), rgba(90,160,215,.8) 52%, rgba(45,100,160,.94));
      opacity: 0; visibility: hidden; transition: opacity .7s, visibility .7s; pointer-events: none;
    }
    #celebration.visible { opacity: 1; visibility: visible; pointer-events: auto; }
    .celebrate-card {
      text-align: center; width: min(92vw, 440px); padding: 0 0 22px;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      background: var(--steel-face); border-radius: 2px;
      box-shadow: 0 0 0 2px var(--steel-outline), 0 18px 55px rgba(0,0,0,.5);
      color: var(--panel-text);
    }
    #celebration.visible .celebrate-card { animation: rise .8s cubic-bezier(.2,.9,.2,1.2); }
    .celebrate-icon { margin-top: 14px; font-size: clamp(4rem, 20vw, 7rem); filter: drop-shadow(0 0 25px #ffc928); }
    .celebrate-card h2 { margin: 8px 16px; font-size: clamp(1.35rem, 5.6vw, 2.2rem); line-height: 1.25; color: var(--panel-text); }
    .celebrate-card strong {
      display: block; width: max-content; max-width: 92%; margin: 10px auto 0; padding: 6px 16px;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); color: #ffe066; font-family: var(--mono); font-size: 1.05em;
      text-shadow: 0 0 8px rgba(255, 224, 102, .6); font-variant-numeric: tabular-nums;
    }
    .celebrate-card p { margin: 14px 16px 0; color: #3c4257; font-weight: 700; }

    @keyframes bump { 35% { transform: scale(1.38) rotate(-2deg); color: #fff; } }
    @keyframes pulse { 50% { transform: scale(1.04); filter: brightness(1.3); } }
    @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes stamp-in {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-17deg) scale(2.4); }
      16% { opacity: 1; transform: translate(-50%, -50%) rotate(-10deg) scale(.84); }
      29% { transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
      78% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(1.04); }
    }
    @keyframes rise { from { transform: translateY(50px) scale(.7); opacity: 0; } }
    @media (min-width: 720px) { #hint { font-size: .8rem; } }
  </style>
</head>
<body>
  <div id="stage" aria-label="サブスクリプションのビル街"></div>

  <section id="opening" aria-live="polite">
    <div class="scan-card">
      <span class="sc-titlebar">📡 GMAIL スキャン</span>
      <p id="scan-message">📩 Gmailをスキャン中…</p>
      <div id="mail-count">0</div>
      <p id="mail-label">請求メールを確認しています</p>
    </div>
    <div id="skip-note">画面をタップしてスキップ</div>
  </section>

  <header id="hud">
    <div class="counter">
      <div class="counter-main">契約中 <span id="active-count">13本</span>　月額合計 <span id="contract-total">¥24,010</span></div>
      <div class="counter-sub">▼<span id="monthly">¥0</span> 節約　年間 <span id="annual">¥0</span></div>
    </div>
  </header>
  <div id="hint">ドラッグで惑星を回転・ビルをタップして選択 <span id="motion-status">・PCはダブルクリックで爆破</span></div>

  <aside id="sheet" aria-live="polite">
    <h2 id="sheet-title"></h2>
    <p id="sheet-detail"></p>
    <div id="sheet-choices">
      <button id="keep-button" class="choice-button" type="button">🌱 育てる</button>
      <button id="destroy-button" class="choice-button" type="button">💥 叩き壊す</button>
    </div>
    <button id="cancel-keep" type="button" hidden>育成を取り消す</button>
    <p id="sheet-action" hidden>📱 振りかぶって叩きつけろ！</p>
  </aside>
  <div id="flash"></div>
  <div id="cancel-stamp" aria-hidden="true">解約!</div>

  <section id="celebration" aria-live="assertive">
    <div class="celebrate-card">
      <span class="sc-titlebar">🏛 市長への報告書</span>
      <div class="celebrate-icon">🌱</div>
      <h2>あなたの街が、整いました。<strong id="celebration-saving">月々 ¥0 の節約</strong></h2>
      <p id="celebration-annual">育てるものと手放すものを、選びました。</p>
    </div>
  </section>

  <section id="title-screen">
    <div class="title-card">
      <h1 class="logo">Zen<span>Cut</span></h1>
      <p class="tagline">サブスクを壊して、未来を育てよう。</p>
      <button id="start" type="button">はじめる</button>
    </div>
  </section>

  <script src="./three.min.js"></script>

      // 平面レイアウト座標(x, z)を球面上の位置・姿勢に変換して配置する
      function placeOnPlanet(object, x, z, lift = 0) {
        const dist = Math.hypot(x, z);
        const orientation = new THREE.Quaternion();
        if (dist > 1e-6) {
          const axis = new THREE.Vector3(z / dist, 0, -x / dist);
          orientation.setFromAxisAngle(axis, dist / PLANET_RADIUS);
        }
        object.quaternion.copy(orientation);
        object.position.copy(PLANET_UP.clone().applyQuaternion(orientation).multiplyScalar(PLANET_RADIUS + lift));
        planet.add(object);
        return orientation;

          position.setZ(i, -(vx * vx + vy * vy) / (2 * PLANET_RADIUS));

        geometry.computeVertexNormals();
        return geometry;

      function addTreePart(geometry, material, position, scale, rotation) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(...position);
        if (scale) mesh.scale.set(...scale);
        if (rotation) mesh.rotation.set(...rotation);
        mesh.castShadow = true;
        savingsTree.add(mesh);
        return mesh;

      function rebuildSavingsTree(stage) {
        savingsTree.clear();
        const trunkHeight = .38 + stage * .43;
        addTreePart(new THREE.ConeGeometry(.5 + stage * .08, .2, 10), treeGold, [0, .1, 0]);
        addTreePart(new THREE.CylinderGeometry(.07 + stage * .035, .11 + stage * .055, trunkHeight, 9), treeGold, [0, .2 + trunkHeight / 2, 0]);

        if (stage === 0) {
          addTreePart(new THREE.SphereGeometry(.18, 10, 7), treeLightGold, [0, trunkHeight + .28, 0], [1, 1.25, 1]);
        } else {
          const leafCount = Math.min(6, stage + 1);
          for (let i = 0; i < leafCount; i += 1) {
            const side = i % 2 === 0 ? -1 : 1;
            const level = Math.floor(i / 2);
            const leafY = trunkHeight * (.58 + level * .16) + .22;
            addTreePart(
              new THREE.SphereGeometry(.3 + stage * .045, 10, 7),
              treeLightGold,
              [side * (.24 + level * .1), leafY, (i % 3 - 1) * .09],
              [1.15, .34, .64],
              [0, side * .22, side * -.48]
            );
          }
        }

        if (stage >= 2) {
          const branchCount = Math.min(5, stage + 1);
          for (let i = 0; i < branchCount; i += 1) {
            const angle = i / branchCount * Math.PI * 2;
            const branch = addTreePart(
              new THREE.CylinderGeometry(.035 + stage * .008, .055 + stage * .01, .65 + stage * .12, 7),
              treeGold,
              [Math.cos(angle) * .22, trunkHeight * .74, Math.sin(angle) * .22],
              null,
              [Math.sin(angle) * .82, 0, -Math.cos(angle) * .82]
            );
            branch.rotation.y = angle;
          }
        }

        if (stage >= 3) {
          const canopyCount = stage === 5 ? 7 : stage + 1;
          const radius = .5 + stage * .15;
          for (let i = 0; i < canopyCount; i += 1) {
            const angle = i / canopyCount * Math.PI * 2;
            const ring = i === canopyCount - 1 ? 0 : radius * .58;
            addTreePart(
              new THREE.SphereGeometry(radius, 10, 7),
              i % 2 ? treeGold : treeLightGold,
              [Math.cos(angle) * ring, trunkHeight + .42 + Math.sin(i * 1.7) * .2, Math.sin(angle) * ring],
              [1, .84, 1]
            );
          }
        }

        const glow = new THREE.PointLight(0xffc329, 14 + stage * 5, 5 + stage * 1.2);
        glow.position.y = trunkHeight + .55;
        savingsTree.add(glow);
        savingsTree.userData.stage = stage;
        savingsTree.userData.stageName = ['小さな芽', '芽', '双葉', '若木', '木', '大樹'][stage];
        savingsTree.scale.setScalar(.08);
        treeGrowthStarted = performance.now();
      }

      // ドラッグで惑星を地球儀のように回す(タップ選択と区別するため移動量で判定)
      let dragPointerId = null;
      let lastDragX = 0, lastDragY = 0, dragTravel = 0;
      const dragAxis = new THREE.Vector3();
      const dragRotation = new THREE.Quaternion();
      function rotatePlanetBy(dx, dy) {
        const factor = .0042 * (cameraView.distance / 38);
        dragAxis.set(1, 0, 0).applyQuaternion(camera.quaternion);
        dragRotation.setFromAxisAngle(dragAxis, dy * factor);
        planet.quaternion.premultiply(dragRotation);
        dragAxis.set(0, 1, 0).applyQuaternion(camera.quaternion);
        dragRotation.setFromAxisAngle(dragAxis, dx * factor);
        planet.quaternion.premultiply(dragRotation);
      }
      renderer.domElement.addEventListener('pointerdown', event => {
        if (pinchActive) return;
        dragPointerId = event.pointerId;
        lastDragX = event.clientX; lastDragY = event.clientY; dragTravel = 0;
      });
      renderer.domElement.addEventListener('pointermove', event => {
        if (event.pointerId !== dragPointerId || pinchActive || openingRunning) return;
        const dx = event.clientX - lastDragX;
        const dy = event.clientY - lastDragY;
        lastDragX = event.clientX; lastDragY = event.clientY;
        dragTravel += Math.abs(dx) + Math.abs(dy);
        if (dragTravel < 7) return;
        suppressTapUntil = performance.now() + 350;
        planetTween = null;
        rotatePlanetBy(dx, dy);
      });
      renderer.domElement.addEventListener('pointercancel', () => { dragPointerId = null; });
      renderer.domElement.addEventListener('pointerup', event => {
        if (event.pointerId === dragPointerId) dragPointerId = null;
      });

      function pinchDistance(touches) {
        return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
      }

      renderer.domElement.addEventListener('touchstart', event => {
        if (event.touches.length !== 2) return;
        pinchActive = true;
        pinchStartDistance = pinchDistance(event.touches);
        pinchStartCameraDistance = cameraDistance;
        suppressTapUntil = performance.now() + 350;
        event.preventDefault();
      }, { passive: false });
      renderer.domElement.addEventListener('touchmove', event => {
        if (!pinchActive || event.touches.length !== 2) return;
        const distance = Math.max(1, pinchDistance(event.touches));
        cameraDistance = clampCameraDistance(pinchStartCameraDistance * pinchStartDistance / distance);
        viewTween = null;
        cameraView.distance = selected ? clampCameraDistance(cameraDistance - 6) : cameraDistance;
        suppressTapUntil = performance.now() + 350;
        event.preventDefault();
      }, { passive: false });
      renderer.domElement.addEventListener('touchend', event => {

        pinchActive = false;

          const gain = audioContext.createGain(); // GainNode
          source.buffer = buffer;
          gain.gain.value = volume;
          source.connect(gain).connect(audioContext.destination);
          source.start();
          return;
        }
        const fallback = sounds[name].cloneNode();
        fallback.volume = volume;
        fallback.play().catch(() => {});
      }

      function animateSavings(amount) {

          const current = from + (to - from) * eased;
          monthlyOutput.textContent = formatYen(current);

      function handleMotion(event) {
        let acceleration = event.acceleration;
        let fallback = false;
        if (!acceleration || acceleration.x == null || acceleration.y == null || acceleration.z == null) {
          acceleration = event.accelerationIncludingGravity;
          fallback = true;
        }
        if (!acceleration || acceleration.x == null || acceleration.y == null || acceleration.z == null) return;
        const magnitude = Math.hypot(acceleration.x, acceleration.y, acceleration.z);
        if (fallback) motionStatus.textContent = '・重力込みモーション計測中';
        if (magnitude > 25) triggerHit();

      async function startExperience() {
        if (started) return;
        started = true;
        startButton.disabled = true;
        startButton.textContent = '準備中…';
        const resumePromise = audioContext ? audioContext.resume() : Promise.resolve();
        let permission = '不要';
        try {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            permission = await DeviceMotionEvent.requestPermission();
          }
          await Promise.allSettled([resumePromise, audioBuffersReady]);
          if (permission !== 'denied' && typeof DeviceMotionEvent !== 'undefined') {
            if (!listening) window.addEventListener('devicemotion', handleMotion);
            listening = true;
            motionStatus.textContent = '・スマホを叩きつけて爆破';
          } else {
            motionStatus.textContent = '・PCはダブルクリックで爆破';
          }
        } catch (error) {
          await Promise.allSettled([resumePromise, audioBuffersReady]);
          motionStatus.textContent = '・ダブルクリックでも爆破できます';
        }
        titleScreen.classList.add('hidden');
        runOpening();
      }
      startButton.addEventListener('click', startExperience);

      const clock = new THREE.Clock();
      function render(now) {
        requestAnimationFrame(render);
        const dt = Math.min(clock.getDelta(), .035);
        const time = now * .001;
        if (viewTween) {
          const progress = Math.min(1, (performance.now() - viewTween.startedAt) / viewTween.duration);
          const eased = progress < .5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          Object.keys(cameraView).forEach(key => {
            cameraView[key] = viewTween.from[key] + (viewTween.to[key] - viewTween.from[key]) * eased;
          });
          if (progress === 1) viewTween = null;
        }
        if (planetTween) {
          const progress = Math.min(1, (performance.now() - planetTween.startedAt) / planetTween.duration);
          const eased = progress < .5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          planet.quaternion.slerpQuaternions(planetTween.from, planetTween.to, eased);
          if (progress === 1) planetTween = null;
        }
        buildings.forEach(building => {
          if (building.userData.buildBorn != null) {
            const buildAge = Math.min(1, (performance.now() - building.userData.buildBorn) / 340);
            const buildBounce = 1 + Math.sin(buildAge * Math.PI * 2.5) * (1 - buildAge) * .18;
            building.scale.setScalar(Math.max(.01, buildAge * buildBounce));
            if (buildAge === 1) building.userData.buildBorn = null;
          }
          if (building === selected && !building.userData.destroyed) {
            building.quaternion.copy(building.userData.baseQuaternion);
            building.rotateZ(Math.sin(time * 18) * .018);
            building.rotateX(Math.sin(time * 22) * .012);
            building.userData.halo.material.opacity = .62 + Math.sin(time * 5) * .25;
          } else {
            building.quaternion.copy(building.userData.baseQuaternion);
          }
          const badge = building.userData.duplicateBadge;
          if (badge && badge.visible) badge.position.y = badge.userData.baseY + Math.sin(time * 3.2 + building.userData.index) * .12;
          const keepDecoration = building.userData.keepDecoration;
          if (keepDecoration && keepDecoration.visible) {
            const keepAge = Math.min(1, (performance.now() - keepDecoration.userData.born) / 560);
            const keepBounce = 1 + Math.sin(keepAge * Math.PI * 3) * (1 - keepAge) * .2;
            keepDecoration.scale.setScalar(Math.max(.01, keepAge * keepBounce));
            keepDecoration.rotation.y = time * .35;
          }
        });
        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const particle = particles[i];
          particle.life -= dt;
          if (particle.light) particle.light.intensity *= .82;
          if (particle.mesh) {
            particle.velocity.y -= 13 * dt;
            particle.mesh.position.addScaledVector(particle.velocity, dt);
            particle.mesh.rotation.x += particle.spin.x * dt;
            particle.mesh.rotation.y += particle.spin.y * dt;
            particle.mesh.rotation.z += particle.spin.z * dt;
            if (particle.life < .35) particle.mesh.scale.multiplyScalar(.9);
          }
          if (particle.life <= 0) {
            if (particle.mesh) scene.remove(particle.mesh);
            if (particle.light) scene.remove(particle.light);
            particles.splice(i, 1);
          }
        }
        if (treeVisible) {
          const treeAge = Math.min(1, (performance.now() - treeGrowthStarted) / 620);
          const treeBounce = 1 + Math.sin(treeAge * Math.PI * 3) * (1 - treeAge) * .2;
          savingsTree.scale.setScalar(Math.max(.08, treeAge * treeBounce));
        } else {
          savingsTree.scale.setScalar(.01);
        }
        savingsTree.quaternion.copy(savingsTreeBaseQuaternion);
        savingsTree.rotateY(Math.sin(time * 1.15) * .045);
        treePartyCoins.forEach(coin => {
          coin.angle += dt * coin.speed;
          const lift = (time * coin.rise + coin.phase) % 1;
          coin.mesh.position.set(
            Math.cos(coin.angle) * coin.radius,
            .7 + lift * 4.6,
            Math.sin(coin.angle) * coin.radius
          );
          coin.mesh.rotation.x += dt * 7;
          coin.mesh.rotation.y += dt * 10;
        });
        const shakeX = cameraShake > .01 ? (Math.random() - .5) * cameraShake : 0;
        const shakeY = cameraShake > .01 ? (Math.random() - .5) * cameraShake : 0;
        if (cameraShake > .01) cameraShake *= .82;
        camera.position.set(
          cameraView.targetX + isoCameraDirection.x * cameraView.distance + shakeX,
          cameraView.targetY + isoCameraDirection.y * cameraView.distance + shakeY,
          cameraView.targetZ + isoCameraDirection.z * cameraView.distance
        );
        camera.lookAt(cameraView.targetX, cameraView.targetY, cameraView.targetZ);
        // 0幅で初期化された場合(非表示タブ読込等)の自己修復
        if (renderer.domElement.width === 0 && innerWidth > 0) dispatchEvent(new Event('resize'));
        renderer.render(scene, camera);
      }
      requestAnimationFrame(render);

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.fov = camera.aspect < .7 ? 52 : 42;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
      });
    })();
  </script>
</body>
</html>
