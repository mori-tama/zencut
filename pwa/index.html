<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#171342">
  <title>ZenCut</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      --ink: #fff8df;
      --gold: #ffd34d;
      --glass: rgba(20, 14, 62, .78);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171342; }
    body { color: var(--ink); touch-action: none; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #stage { background: linear-gradient(#171342 0%, #6c327d 44%, #f08b69 72%, #172a51 100%); }

    #title-screen {
      position: fixed; z-index: 20; inset: 0; display: grid; place-items: end center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(44px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(17, 11, 56, .05), rgba(17, 11, 56, .15) 45%, rgba(12, 9, 42, .9)),
                  url('./assets/title.png') center 44% / cover no-repeat;
      transition: opacity .55s ease, visibility .55s;
    }
    #title-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .title-card { width: min(100%, 430px); text-align: center; filter: drop-shadow(0 5px 10px #171342); }
    .logo { margin: 0; font-size: clamp(3.8rem, 16vw, 6.2rem); font-weight: 1000; letter-spacing: -.08em; line-height: .92; }
    .logo span { color: var(--gold); }
    .tagline { margin: 12px 0 22px; font-weight: 800; letter-spacing: .12em; text-shadow: 0 2px 8px #171342; }
    #start {
      width: min(88%, 330px); min-height: 64px; border: 2px solid #fff0ac; border-radius: 999px;
      color: #3b2450; background: linear-gradient(#fff4a6, #ffbe36); font-size: 1.25rem; font-weight: 1000;
      box-shadow: 0 8px 0 #b15b2d, 0 14px 30px rgba(0,0,0,.35); cursor: pointer;
    }
    #start:active { transform: translateY(5px); box-shadow: 0 3px 0 #b15b2d; }

    #hud {
      position: fixed; z-index: 5; top: 0; left: 0; right: 0; pointer-events: none;
      padding: max(10px, env(safe-area-inset-top)) 12px 0;
      display: flex; justify-content: center;
    }
    .counter {
      min-width: min(94vw, 390px); padding: 10px 18px 9px; border: 1px solid rgba(255,255,255,.23); border-radius: 20px;
      text-align: center; background: linear-gradient(135deg, rgba(41,25,89,.91), rgba(24,17,64,.76));
      box-shadow: 0 7px 25px rgba(5,4,30,.34), inset 0 1px rgba(255,255,255,.18); backdrop-filter: blur(10px);
    }
    .counter-main { font-size: clamp(.93rem, 4vw, 1.14rem); font-weight: 800; }
    #contract-total { color: #fff; font-size: 1.08em; font-weight: 1000; font-variant-numeric: tabular-nums; }
    #monthly { display: inline-block; color: var(--gold); font-size: 1.28em; font-weight: 1000; font-variant-numeric: tabular-nums; }
    #monthly.bump { animation: bump .55s ease; }
    .counter-sub { margin-top: 1px; color: #e5dffc; font-size: .76rem; letter-spacing: .08em; }

    #hint {
      position: fixed; z-index: 5; top: max(84px, calc(env(safe-area-inset-top) + 76px)); left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 90vw; padding: 7px 13px; border-radius: 999px; background: rgba(17,12,54,.6);
      color: #f5eaff; font-size: .72rem; text-align: center; pointer-events: none; transition: opacity .3s;
    }
    #motion-status { color: #ffd76a; }

    #sheet {
      position: fixed; z-index: 8; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom));
      margin: auto; width: min(calc(100% - 20px), 520px); padding: 15px 18px 14px; border: 1px solid rgba(255,255,255,.25);
      border-radius: 24px; background: var(--glass); box-shadow: 0 12px 40px rgba(4,3,27,.48); backdrop-filter: blur(14px);
      text-align: center; transform: translateY(calc(100% + 28px)); opacity: 0; transition: .28s cubic-bezier(.2,.9,.2,1.1); pointer-events: none;
    }
    #sheet.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
    #sheet-title { margin: 0; color: #fff; font-size: 1.25rem; font-weight: 1000; }
    #sheet-detail { margin: 4px 0 10px; color: #ddd5f5; font-size: .91rem; }
    #sheet-action { margin: 8px 0 1px; color: var(--gold); font-size: 1.05rem; font-weight: 1000; animation: pulse 1s ease-in-out infinite; }
    #sheet-action[hidden], #sheet-choices[hidden], #cancel-keep[hidden] { display: none; }
    #sheet-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice-button, #cancel-keep {
      min-height: 52px; border: 1px solid rgba(255,255,255,.28); border-radius: 16px; color: #fff;
      font-weight: 1000; cursor: pointer; touch-action: manipulation; box-shadow: inset 0 1px rgba(255,255,255,.2);
    }
    #keep-button { background: linear-gradient(135deg, #17875d, #36b977); }
    #destroy-button { background: linear-gradient(135deg, #b43138, #f35d3c); }
    #cancel-keep { width: 100%; background: rgba(255,255,255,.12); }

    #flash { position: fixed; z-index: 7; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle, #fffde0, #ffbf24 28%, #ff4d00 58%, transparent 73%); mix-blend-mode: screen; }
    #flash.go { animation: flash .44s ease-out; }

    #celebration {
      position: fixed; z-index: 15; inset: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 56%, rgba(255,205,55,.28), rgba(15,10,55,.78) 52%, rgba(9,7,35,.94));
      opacity: 0; visibility: hidden; transition: opacity .7s, visibility .7s; pointer-events: none;
    }
    #celebration.visible { opacity: 1; visibility: visible; pointer-events: auto; }
    .celebrate-card { text-align: center; }
    #celebration.visible .celebrate-card { animation: rise .8s cubic-bezier(.2,.9,.2,1.2); }
    .celebrate-icon { font-size: clamp(5rem, 25vw, 9rem); filter: drop-shadow(0 0 25px #ffc928); }
    .celebrate-card h2 { margin: 8px 0; font-size: clamp(1.75rem, 7vw, 3rem); line-height: 1.2; }
    .celebrate-card strong { display: block; color: var(--gold); font-size: 1.25em; }
    .celebrate-card p { margin: 14px 0 0; color: #eee8ff; font-weight: 700; }

    @keyframes bump { 35% { transform: scale(1.38) rotate(-2deg); color: #fff; } }
    @keyframes pulse { 50% { transform: scale(1.04); filter: brightness(1.3); } }
    @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes rise { from { transform: translateY(50px) scale(.7); opacity: 0; } }
    @media (min-width: 720px) { #hint { font-size: .8rem; } }
  </style>
</head>
<body>
  <div id="stage" aria-label="サブスクリプションのビル街"></div>

  <header id="hud">
    <div class="counter">
      <div class="counter-main">契約中 <span id="active-count">7本</span>　月額合計 <span id="contract-total">¥15,010</span></div>
      <div class="counter-sub">▼<span id="monthly">¥0</span> 節約　年間 <span id="annual">¥0</span></div>
    </div>
  </header>
  <div id="hint">ビルをタップして選択 <span id="motion-status">・PCはダブルクリックで爆破</span></div>

  <aside id="sheet" aria-live="polite">
    <h2 id="sheet-title"></h2>
    <p id="sheet-detail"></p>
    <div id="sheet-choices">
      <button id="keep-button" class="choice-button" type="button">🌱 育てる</button>
      <button id="destroy-button" class="choice-button" type="button">💥 叩き壊す</button>
    </div>
    <button id="cancel-keep" type="button" hidden>育成を取り消す</button>
    <p id="sheet-action" hidden>📱 振りかぶって叩きつけろ！</p>
  </aside>
  <div id="flash"></div>

  <section id="celebration" aria-live="assertive">
    <div class="celebrate-card">
      <div class="celebrate-icon">🌱</div>
      <h2>あなたの街が、整いました。<strong id="celebration-saving">月々 ¥0 の節約</strong></h2>
      <p id="celebration-annual">育てるものと手放すものを、選びました。</p>
    </div>
  </section>

  <section id="title-screen">
    <div class="title-card">
      <h1 class="logo">Zen<span>Cut</span></h1>
      <p class="tagline">サブスクを壊して、未来を育てよう。</p>
      <button id="start" type="button">はじめる</button>
    </div>
  </section>

  <script src="./three.min.js"></script>
  <script>
    (() => {
      'use strict';

      const districts = [
        { genre: '動画', name: '動画街', color: 0x713c62, center: [-5.1, -1.45], size: [3.4, 3.2] },
        { genre: '音楽', name: '音楽街', color: 0x315b83, center: [0, -3.15], size: [4.2, 2.4] },
        { genre: 'ゲーム', name: 'ゲーム街', color: 0x563d80, center: [5.05, -1.45], size: [3.2, 3.0] },
        { genre: '学び', name: '学び街', color: 0x795239, center: [-3.05, 2.25], size: [4.2, 2.8] },
        { genre: 'からだ', name: 'からだ街', color: 0x28695c, center: [3.4, 2.25], size: [3.5, 2.8] }
      ];
      const subscriptions = [
        { name: 'MOOVA', icon: '🎬', genre: '動画', contracted: true, price: 2400, months: 36, color: 0xf05252, dark: 0x8b294d, position: [-5.75, -2.05] },
        { name: 'CINEPOP', icon: '🍿', genre: '動画', contracted: true, price: 990, months: 14, color: 0xe95b8e, dark: 0x8b315f, position: [-4.45, -2.05] },
        { name: 'PRIMELY', icon: '▶️', genre: '動画', contracted: false, price: 0, months: 0, color: 0x777381, dark: 0x4d4b57, position: [-5.75, -.75] },
        { name: 'TUBEMAX', icon: '📺', genre: '動画', contracted: false, price: 0, months: 0, color: 0x777381, dark: 0x4d4b57, position: [-4.45, -.75] },
        { name: 'BEATLY', icon: '🎵', genre: '音楽', contracted: true, price: 980, months: 24, color: 0x3299db, dark: 0x294b9b, position: [-1.35, -3.15] },
        { name: 'TUNEBOX', icon: '🎧', genre: '音楽', contracted: true, price: 1080, months: 8, color: 0x48b8d5, dark: 0x31689b, position: [0, -3.15] },
        { name: 'MELODIN', icon: '🎼', genre: '音楽', contracted: false, price: 0, months: 0, color: 0x727985, dark: 0x474d57, position: [1.35, -3.15] },
        { name: 'GEMPOP', icon: '💎', genre: 'ゲーム', contracted: true, price: 1280, months: 30, color: 0xa54cce, dark: 0x4b388f, position: [4.45, -1.65] },
        { name: 'PLAYPASS', icon: '🎮', genre: 'ゲーム', contracted: false, price: 0, months: 0, color: 0x777181, dark: 0x4b4855, position: [5.75, -1.65] },
        { name: 'LINGOZA', icon: '📖', genre: '学び', contracted: true, price: 480, months: 12, color: 0xf1a328, dark: 0xc04c42, position: [-4.35, 2.25] },
        { name: 'SKILLPON', icon: '✏️', genre: '学び', contracted: false, price: 0, months: 0, color: 0x81776e, dark: 0x554f49, position: [-3.05, 2.25] },
        { name: 'BRAINGO', icon: '🧠', genre: '学び', contracted: false, price: 0, months: 0, color: 0x81776e, dark: 0x554f49, position: [-1.75, 2.25] },
        { name: 'GYMO', icon: '🏋️', genre: 'からだ', contracted: true, price: 7800, months: 18, color: 0x23ad79, dark: 0x126b70, position: [2.75, 2.25] },
        { name: 'FITMORE', icon: '🏃', genre: 'からだ', contracted: false, price: 0, months: 0, color: 0x6f7e79, dark: 0x46524f, position: [4.05, 2.25] }
      ];
      const audioNames = ['big-explosion1', 'building-collapse-little1', 'hyun1', 'nyu1', 'jajean1', 'shine2', 'money-drop1', 'amount-display1', 'extend1', 'kira2'];
      const sounds = Object.fromEntries(audioNames.map(name => [name, new Audio(`./assets/se/${name}.mp3`)]));
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const audioContext = AudioContextClass ? new AudioContextClass() : null;
      const audioBuffers = {};
      const audioBufferLoads = audioNames.map(async name => {
        if (!audioContext) return;
        try {
          const response = await fetch(`./assets/se/${name}.mp3`);
          if (!response.ok) throw new Error(`SE fetch failed: ${response.status}`);
          audioBuffers[name] = await audioContext.decodeAudioData(await response.arrayBuffer());
        } catch (error) {
          console.warn(`${name}はHTMLAudioへフォールバックします`, error);
        }
      });
      const audioBuffersReady = Promise.allSettled(audioBufferLoads);
      const stage = document.querySelector('#stage');
      const sheet = document.querySelector('#sheet');
      const sheetTitle = document.querySelector('#sheet-title');
      const sheetDetail = document.querySelector('#sheet-detail');
      const sheetChoices = document.querySelector('#sheet-choices');
      const sheetAction = document.querySelector('#sheet-action');
      const keepButton = document.querySelector('#keep-button');
      const destroyButton = document.querySelector('#destroy-button');
      const cancelKeepButton = document.querySelector('#cancel-keep');
      const monthlyOutput = document.querySelector('#monthly');
      const annualOutput = document.querySelector('#annual');
      const activeCountOutput = document.querySelector('#active-count');
      const contractTotalOutput = document.querySelector('#contract-total');
      const flash = document.querySelector('#flash');
      const motionStatus = document.querySelector('#motion-status');
      const celebration = document.querySelector('#celebration');
      const celebrationSaving = document.querySelector('#celebration-saving');
      const celebrationAnnual = document.querySelector('#celebration-annual');
      const startButton = document.querySelector('#start');
      const titleScreen = document.querySelector('#title-screen');
      const formatYen = value => `¥${Math.round(value).toLocaleString('ja-JP')}`;

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x4c286d, 24, 48);
      const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, .1, 100);
      camera.position.set(0, 14.2, innerWidth / innerHeight < .7 ? 39 : 29);
      camera.lookAt(0, 2.4, 0);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      stage.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffb9b0, 0x172a49, 2.45));
      const sun = new THREE.DirectionalLight(0xffd9a0, 3.2);
      sun.position.set(-7, 14, 9);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1024, 1024);
      scene.add(sun);
      const purpleLight = new THREE.PointLight(0x7c4dff, 32, 24);
      purpleLight.position.set(7, 7, 4);
      scene.add(purpleLight);

      const ground = new THREE.Mesh(
        new THREE.CylinderGeometry(10.5, 11.3, .75, 8),
        new THREE.MeshStandardMaterial({ color: 0x24365b, roughness: .72, metalness: .12 })
      );
      ground.position.y = -.42;
      ground.receiveShadow = true;
      scene.add(ground);
      const plaza = new THREE.Mesh(
        new THREE.CylinderGeometry(8.8, 9.2, .12, 8),
        new THREE.MeshStandardMaterial({ color: 0x55416f, roughness: .83 })
      );
      plaza.position.y = .02;
      plaza.receiveShadow = true;
      scene.add(plaza);

      function createDistrictLabel(district) {
        const canvas = document.createElement('canvas');
        canvas.width = 384; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#241849'; ctx.fillRect(0, 0, 384, 128);
        ctx.strokeStyle = '#ffe07a'; ctx.lineWidth = 9; ctx.strokeRect(5, 5, 374, 118);
        ctx.fillStyle = '#fff8db'; ctx.font = '900 55px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(district.name, 192, 66);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: true }));
        label.scale.set(1.85, .62, 1);
        label.position.set(district.center[0], .62, district.center[1] + district.size[1] / 2 - .15);
        return label;
      }

      districts.forEach(district => {
        const tile = new THREE.Mesh(
          new THREE.BoxGeometry(district.size[0], .14, district.size[1]),
          new THREE.MeshStandardMaterial({ color: district.color, roughness: .72, metalness: .08 })
        );
        tile.position.set(district.center[0], .13, district.center[1]);
        tile.receiveShadow = true;
        scene.add(tile);
        scene.add(createDistrictLabel(district));
      });

      const starGeometry = new THREE.BufferGeometry();
      const starPositions = [];
      for (let i = 0; i < 85; i += 1) starPositions.push((Math.random() - .5) * 35, 8 + Math.random() * 16, -7 - Math.random() * 10);
      starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
      scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xfff5cf, size: .075, transparent: true, opacity: .85 })));

      const buildings = [];
      const clickableMeshes = [];
      const particles = [];
      const sprouts = [];
      const treePartyCoins = [];
      const savingsTree = new THREE.Group();
      const treeGold = new THREE.MeshStandardMaterial({ color: 0xffc52f, emissive: 0xff8b0b, emissiveIntensity: 1.15, metalness: .42, roughness: .3 });
      const treeLightGold = new THREE.MeshStandardMaterial({ color: 0xffed72, emissive: 0xffb51f, emissiveIntensity: 1.7, metalness: .25, roughness: .26 });
      let treeStage = 0;
      let treeGrowthStarted = performance.now();
      let selected = null;
      let destroyArmed = false;
      let celebrationShown = false;
      let celebrationTimer = null;
      let savedMonthly = 0;
      let destroyedCount = 0;
      let cameraShake = 0;
      let lastHitAt = -Infinity;
      let listening = false;
      let started = false;

      function roundedBox(width, height, depth, color, y, bevel = .08) {
        const geometry = new THREE.BoxGeometry(width, height, depth, 2, 2, 2);
        const position = geometry.attributes.position;
        for (let i = 0; i < position.count; i += 1) {
          const x = position.getX(i), z = position.getZ(i);
          const scale = 1 - bevel * Math.max(0, Math.abs(position.getY(i)) / (height / 2));
          position.setXYZ(i, x * scale, position.getY(i), z * scale);
        }
        geometry.computeVertexNormals();
        const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color, roughness: .58, metalness: .12 }));
        mesh.position.y = y;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      function createSign(sub) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 512, 256);
        gradient.addColorStop(0, sub.contracted ? '#291d65' : '#4d4b55');
        gradient.addColorStop(1, sub.contracted ? '#6941aa' : '#77737d');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, 512, 256);
        ctx.strokeStyle = sub.contracted ? '#ffd65c' : '#aaa5af'; ctx.lineWidth = 13; ctx.strokeRect(8, 8, 496, 240);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '86px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(sub.icon, 92, 114);
        ctx.font = `900 ${sub.name.length > 7 ? 45 : 55}px sans-serif`; ctx.fillText(sub.name, 320, 87);
        ctx.font = '700 38px sans-serif'; ctx.fillStyle = sub.contracted ? '#ffe47d' : '#ddd9df';
        ctx.fillText(sub.contracted ? `${formatYen(sub.price)}/mo` : '未契約', 320, 164);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.22, .61), new THREE.MeshBasicMaterial({ map: texture, transparent: true }));
        sign.position.z = .56;
        return sign;
      }

      function addWindows(group, width, height, baseY, sub) {
        const rows = Math.max(1, Math.floor(height / .62));
        const cols = 2;
        const material = sub.contracted
          ? new THREE.MeshStandardMaterial({ color: 0xffe16a, emissive: 0xff9d23, emissiveIntensity: 2.1 })
          : new THREE.MeshStandardMaterial({ color: 0x555665, emissive: 0x151620, emissiveIntensity: .15 });
        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < cols; col += 1) {
            if ((row + col + sub.months) % 5 === 0) continue;
            const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(.19, .17, .035), material);
            windowMesh.position.set((col - .5) * .38, baseY - height / 2 + .38 + row * .48, .558);
            group.add(windowMesh);
          }
        }
      }

      function createBuilding(sub, index) {
        const paid = sub.price * sub.months;
        const height = sub.contracted ? 1.75 + Math.sqrt(paid / 140400) * 4.15 : 1.35;
        const group = new THREE.Group();
        group.position.set(sub.position[0], .18, sub.position[1]);
        group.rotation.y = sub.position[0] * -.009;
        group.userData = { sub, index, destroyed: false, decision: null, baseX: group.position.x, baseY: .18, height, duplicateBadge: null, keepDecoration: null };

        const bodyHeight = height - .72;
        const base = roundedBox(1.14, bodyHeight, 1.05, sub.color, bodyHeight / 2 + .08);
        base.castShadow = sub.contracted;
        base.userData.building = group;
        group.add(base);
        if (sub.contracted) clickableMeshes.push(base);
        group.userData.body = base;
        addWindows(group, 1.14, bodyHeight, bodyHeight / 2 + .08, sub);

        const upper = roundedBox(1.02, .72, .95, sub.dark, height - .3);
        upper.castShadow = sub.contracted;
        upper.userData.building = group;
        group.add(upper);
        if (sub.contracted) clickableMeshes.push(upper);
        const roof = roundedBox(.82, .18, .76, sub.contracted ? 0x413267 : 0x55545d, height + .14, .04);
        roof.castShadow = sub.contracted;
        group.add(roof);
        const cap = roundedBox(.43, .18, .4, sub.color, height + .32, .03);
        cap.castShadow = sub.contracted;
        group.add(cap);
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(.025, .035, .38, 7), new THREE.MeshStandardMaterial({ color: sub.contracted ? 0xffd75e : 0x77747d, emissive: sub.contracted ? 0xff8a1f : 0x111111, emissiveIntensity: sub.contracted ? 1.5 : 0 }));
        antenna.position.y = height + .6; group.add(antenna);
        const sign = createSign(sub); sign.position.y = height - .3; sign.userData.building = group; group.add(sign);
        if (sub.contracted) clickableMeshes.push(sign);

        const halo = new THREE.Mesh(new THREE.RingGeometry(.73, .89, 24), new THREE.MeshBasicMaterial({ color: 0xffd54a, transparent: true, opacity: 0, side: THREE.DoubleSide }));
        halo.rotation.x = -Math.PI / 2; halo.position.y = .14; group.add(halo); group.userData.halo = halo;
        scene.add(group); buildings.push(group);
      }
      subscriptions.forEach(createBuilding);

      function createDuplicateBadge(building) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 96;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#d9293f'; ctx.fillRect(4, 4, 248, 88);
        ctx.strokeStyle = '#fff0dc'; ctx.lineWidth = 7; ctx.strokeRect(4, 4, 248, 88);
        ctx.fillStyle = '#fff'; ctx.font = '900 40px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⚠ 重複', 128, 50);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const badge = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: true }));
        badge.scale.set(1.45, .54, 1);
        badge.userData.baseY = building.userData.height + 1.15;
        badge.position.y = badge.userData.baseY;
        badge.visible = false;
        building.add(badge);
        building.userData.duplicateBadge = badge;
      }

      function updateDuplicateBadges() {
        const activeByGenre = {};
        buildings.forEach(building => {
          const { sub, destroyed } = building.userData;
          if (sub.contracted && !destroyed) activeByGenre[sub.genre] = (activeByGenre[sub.genre] || 0) + 1;
        });
        buildings.forEach(building => {
          const { sub, destroyed, duplicateBadge } = building.userData;
          if (!duplicateBadge && sub.contracted) createDuplicateBadge(building);
          if (building.userData.duplicateBadge) building.userData.duplicateBadge.visible = !destroyed && activeByGenre[sub.genre] >= 2;
        });
      }
      updateDuplicateBadges();

      function updateContractHeader() {
        const active = buildings.filter(building => building.userData.sub.contracted && !building.userData.destroyed);
        activeCountOutput.textContent = `${active.length}本`;
        contractTotalOutput.textContent = formatYen(active.reduce((sum, building) => sum + building.userData.sub.price, 0));
      }
      updateContractHeader();

      function addTreePart(geometry, material, position, scale, rotation) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(...position);
        if (scale) mesh.scale.set(...scale);
        if (rotation) mesh.rotation.set(...rotation);
        mesh.castShadow = true;
        savingsTree.add(mesh);
        return mesh;
      }

      function rebuildSavingsTree(stage) {
        savingsTree.clear();
        const trunkHeight = .38 + stage * .43;
        addTreePart(new THREE.ConeGeometry(.5 + stage * .08, .2, 10), treeGold, [0, .1, 0]);
        addTreePart(new THREE.CylinderGeometry(.07 + stage * .035, .11 + stage * .055, trunkHeight, 9), treeGold, [0, .2 + trunkHeight / 2, 0]);

        if (stage === 0) {
          addTreePart(new THREE.SphereGeometry(.18, 10, 7), treeLightGold, [0, trunkHeight + .28, 0], [1, 1.25, 1]);
        } else {
          const leafCount = Math.min(6, stage + 1);
          for (let i = 0; i < leafCount; i += 1) {
            const side = i % 2 === 0 ? -1 : 1;
            const level = Math.floor(i / 2);
            const leafY = trunkHeight * (.58 + level * .16) + .22;
            addTreePart(
              new THREE.SphereGeometry(.3 + stage * .045, 10, 7),
              treeLightGold,
              [side * (.24 + level * .1), leafY, (i % 3 - 1) * .09],
              [1.15, .34, .64],
              [0, side * .22, side * -.48]
            );
          }
        }

        if (stage >= 2) {
          const branchCount = Math.min(5, stage + 1);
          for (let i = 0; i < branchCount; i += 1) {
            const angle = i / branchCount * Math.PI * 2;
            const branch = addTreePart(
              new THREE.CylinderGeometry(.035 + stage * .008, .055 + stage * .01, .65 + stage * .12, 7),
              treeGold,
              [Math.cos(angle) * .22, trunkHeight * .74, Math.sin(angle) * .22],
              null,
              [Math.sin(angle) * .82, 0, -Math.cos(angle) * .82]
            );
            branch.rotation.y = angle;
          }
        }

        if (stage >= 3) {
          const canopyCount = stage === 5 ? 7 : stage + 1;
          const radius = .5 + stage * .15;
          for (let i = 0; i < canopyCount; i += 1) {
            const angle = i / canopyCount * Math.PI * 2;
            const ring = i === canopyCount - 1 ? 0 : radius * .58;
            addTreePart(
              new THREE.SphereGeometry(radius, 10, 7),
              i % 2 ? treeGold : treeLightGold,
              [Math.cos(angle) * ring, trunkHeight + .42 + Math.sin(i * 1.7) * .2, Math.sin(angle) * ring],
              [1, .84, 1]
            );
          }
        }

        const glow = new THREE.PointLight(0xffc329, 14 + stage * 5, 5 + stage * 1.2);
        glow.position.y = trunkHeight + .55;
        savingsTree.add(glow);
        savingsTree.userData.stage = stage;
        savingsTree.userData.stageName = ['小さな芽', '芽', '双葉', '若木', '木', '大樹'][stage];
        savingsTree.scale.setScalar(.08);
        treeGrowthStarted = performance.now();
      }

      function growSavingsTree() {
        treeStage = Math.min(5, treeStage + 1);
        rebuildSavingsTree(treeStage);
        playSound('extend1', .82);
        setTimeout(() => playSound('kira2', .78), 230);
      }

      function createTreeCoinParty() {
        const geometry = new THREE.CylinderGeometry(.18, .18, .06, 14);
        const material = new THREE.MeshStandardMaterial({ color: 0xffcf32, emissive: 0xff920b, emissiveIntensity: .8, metalness: .82, roughness: .2 });
        for (let i = 0; i < 34; i += 1) {
          const coin = new THREE.Mesh(geometry, material);
          coin.rotation.z = Math.PI / 2;
          scene.add(coin);
          treePartyCoins.push({ mesh: coin, angle: i / 34 * Math.PI * 2, radius: 1.25 + Math.random() * 2.25, phase: Math.random(), speed: .45 + Math.random() * .75, rise: .15 + Math.random() * .18 });
        }
      }

      savingsTree.position.set(0, .12, 4.15);
      scene.add(savingsTree);
      rebuildSavingsTree(0);

      function createKeepDecoration(building) {
        if (building.userData.keepDecoration) {
          building.userData.keepDecoration.visible = true;
          building.userData.keepDecoration.scale.setScalar(.01);
          building.userData.keepDecoration.userData.born = performance.now();
          building.userData.body.material.emissive.setHex(0x16854b);
          building.userData.body.material.emissiveIntensity = .75;
          return;
        }
        const mini = new THREE.Group();
        mini.position.y = building.userData.height + .52;
        const gold = new THREE.MeshStandardMaterial({ color: 0xffdd45, emissive: 0xff9c14, emissiveIntensity: 1.5, metalness: .25, roughness: .3 });
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(.035, .055, .48, 7), gold);
        stem.position.y = .22; mini.add(stem);
        const leafGeometry = new THREE.SphereGeometry(.19, 8, 6);
        const left = new THREE.Mesh(leafGeometry, gold); left.scale.set(1, .34, .6); left.rotation.z = .52; left.position.set(-.15, .44, 0); mini.add(left);
        const right = left.clone(); right.rotation.z = -.52; right.position.x = .15; mini.add(right);
        const aura = new THREE.PointLight(0x42ff91, 11, 3.5); aura.position.y = .3; mini.add(aura);
        const auraRing = new THREE.Mesh(new THREE.RingGeometry(.62, .76, 24), new THREE.MeshBasicMaterial({ color: 0x55ff99, transparent: true, opacity: .8, side: THREE.DoubleSide }));
        auraRing.rotation.x = -Math.PI / 2; auraRing.position.y = -building.userData.height - .36; mini.add(auraRing);
        mini.scale.setScalar(.01);
        mini.userData.born = performance.now();
        building.add(mini);
        building.userData.keepDecoration = mini;
        building.userData.body.material.emissive.setHex(0x16854b);
        building.userData.body.material.emissiveIntensity = .75;
      }

      function updateSheet() {
        if (!selected || selected.userData.destroyed) {
          sheet.classList.remove('visible');
          return;
        }
        const { sub, decision } = selected.userData;
        sheetTitle.textContent = `${sub.icon} ${sub.name}  ${formatYen(sub.price)}/月`;
        sheetDetail.textContent = `${sub.genre}街・${sub.months}ヶ月契約中・累計${formatYen(sub.price * sub.months)}`;
        sheetChoices.hidden = decision === 'keep' || destroyArmed;
        cancelKeepButton.hidden = decision !== 'keep';
        sheetAction.hidden = !destroyArmed;
        if (decision === 'keep') sheetDetail.textContent += '・🌱育成中';
        sheet.classList.add('visible');
      }

      function selectBuilding(building) {
        if (!building || building.userData.destroyed || !building.userData.sub.contracted) return;
        playSound('hyun1', .72);
        const sameBuilding = selected === building;
        if (selected) selected.userData.halo.material.opacity = 0;
        selected = building;
        if (!sameBuilding) destroyArmed = false;
        selected.userData.halo.material.opacity = .95;
        updateSheet();
      }

      function markKeep() {
        if (!selected || selected.userData.destroyed) return;
        selected.userData.decision = 'keep';
        destroyArmed = false;
        createKeepDecoration(selected);
        playSound('extend1', .82);
        setTimeout(() => playSound('kira2', .78), 230);
        updateSheet();
        checkAllDecided();
      }

      function cancelKeep() {
        if (!selected || selected.userData.decision !== 'keep') return;
        selected.userData.decision = null;
        if (selected.userData.keepDecoration) selected.userData.keepDecoration.visible = false;
        selected.userData.body.material.emissive.setHex(0x000000);
        selected.userData.body.material.emissiveIntensity = 1;
        updateSheet();
        checkAllDecided();
      }

      keepButton.addEventListener('click', markKeep);
      destroyButton.addEventListener('click', () => {
        if (!selected || selected.userData.destroyed) return;
        if (selected.userData.decision === 'keep') cancelKeep();
        destroyArmed = true;
        updateSheet();
      });
      cancelKeepButton.addEventListener('click', cancelKeep);

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      function pick(event) {
        pointer.x = event.clientX / innerWidth * 2 - 1;
        pointer.y = -(event.clientY / innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(clickableMeshes, false).find(item => !item.object.userData.building.userData.destroyed);
        if (hit) selectBuilding(hit.object.userData.building);
      }
      renderer.domElement.addEventListener('pointerup', pick);
      renderer.domElement.addEventListener('dblclick', event => {
        pick(event);
        if (selected) triggerHit();
      });

      function playSound(name, volume = 1) {
        const buffer = audioBuffers[name];
        if (audioContext && buffer) {
          const source = audioContext.createBufferSource(); // AudioBufferSourceNode（再生ごとに生成して重複可）
          const gain = audioContext.createGain(); // GainNode
          source.buffer = buffer;
          gain.gain.value = volume;
          source.connect(gain).connect(audioContext.destination);
          source.start();
          return;
        }
        const fallback = sounds[name].cloneNode();
        fallback.volume = volume;
        fallback.play().catch(() => {});
      }

      function createExplosion(building) {
        const sub = building.userData.sub;
        const origin = new THREE.Vector3();
        building.getWorldPosition(origin);
        origin.y += building.userData.height * .48;
        const debrisMaterial = new THREE.MeshStandardMaterial({ color: sub.color, roughness: .55, emissive: sub.dark, emissiveIntensity: .18 });
        for (let i = 0; i < 50; i += 1) {
          const size = .16 + Math.random() * .32;
          const piece = new THREE.Mesh(new THREE.BoxGeometry(size, size * (.7 + Math.random()), size), debrisMaterial);
          piece.position.copy(origin).add(new THREE.Vector3((Math.random() - .5) * 1.7, (Math.random() - .5) * building.userData.height, (Math.random() - .5) * 1.3));
          piece.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
          scene.add(piece);
          const angle = Math.random() * Math.PI * 2;
          const speed = 3 + Math.random() * 6;
          particles.push({ mesh: piece, velocity: new THREE.Vector3(Math.cos(angle) * speed, 4.5 + Math.random() * 7, Math.sin(angle) * speed), spin: new THREE.Vector3(Math.random() * 9, Math.random() * 9, Math.random() * 9), life: 1.1 + Math.random() * .35, coin: false });
        }
        const coinMaterial = new THREE.MeshStandardMaterial({ color: 0xffc229, emissive: 0xff8a00, emissiveIntensity: .65, metalness: .75, roughness: .24 });
        for (let i = 0; i < 16; i += 1) {
          const coin = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, .075, 16), coinMaterial);
          coin.rotation.z = Math.PI / 2;
          coin.position.copy(origin).add(new THREE.Vector3((Math.random() - .5) * 1.2, Math.random() * 2, (Math.random() - .5)));
          scene.add(coin);
          const angle = Math.random() * Math.PI * 2;
          particles.push({ mesh: coin, velocity: new THREE.Vector3(Math.cos(angle) * (4 + Math.random() * 5), 6 + Math.random() * 7, Math.sin(angle) * (4 + Math.random() * 5)), spin: new THREE.Vector3(5 + Math.random() * 8, 8 + Math.random() * 10, 4), life: 1.3, coin: true });
        }
        const burst = new THREE.PointLight(0xff9b21, 70, 13);
        burst.position.copy(origin); scene.add(burst);
        particles.push({ light: burst, life: .42 });
      }

      function createSprout(building) {
        playSound('nyu1', .82);
        const group = new THREE.Group();
        group.position.set(building.position.x, .12, building.position.z);
        group.scale.setScalar(.01);
        const gold = new THREE.MeshStandardMaterial({ color: 0xffd633, emissive: 0xffa514, emissiveIntensity: 1.35, metalness: .28, roughness: .3 });
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(.08, .12, 1.25, 8), gold); stem.position.y = .68; group.add(stem);
        const leafGeometry = new THREE.SphereGeometry(.48, 12, 8);
        const left = new THREE.Mesh(leafGeometry, gold); left.scale.set(1, .34, .58); left.rotation.z = .5; left.position.set(-.37, 1.18, 0); group.add(left);
        const right = left.clone(); right.rotation.z = -.5; right.position.x = .37; group.add(right);
        const glow = new THREE.PointLight(0xffbd31, 18, 5); glow.position.y = 1.1; group.add(glow);
        scene.add(group); sprouts.push({ group, born: performance.now(), target: 1 });
      }

      function animateSavings(amount) {
        const from = savedMonthly;
        const to = savedMonthly + amount;
        savedMonthly = to;
        const startAt = performance.now();
        function step(now) {
          const t = Math.min(1, (now - startAt) / 720);
          const eased = 1 - Math.pow(1 - t, 3);
          const current = from + (to - from) * eased;
          monthlyOutput.textContent = formatYen(current);
          annualOutput.textContent = formatYen(current * 12);
          if (t < 1) requestAnimationFrame(step);
        }
        monthlyOutput.classList.remove('bump'); void monthlyOutput.offsetWidth; monthlyOutput.classList.add('bump');
        requestAnimationFrame(step);
      }

      function checkAllDecided() {
        if (celebrationShown) return;
        const contractedBuildings = buildings.filter(building => building.userData.sub.contracted);
        const complete = contractedBuildings.every(building => building.userData.decision === 'keep' || building.userData.decision === 'destroyed');
        if (!complete) {
          clearTimeout(celebrationTimer);
          celebrationTimer = null;
          return;
        }
        if (celebrationTimer) return;
        sheet.classList.remove('visible');
        celebrationTimer = setTimeout(() => {
          celebrationTimer = null;
          const stillComplete = contractedBuildings.every(building => building.userData.decision === 'keep' || building.userData.decision === 'destroyed');
          if (!stillComplete) return;
          celebrationShown = true;
          sprouts.forEach((sprout, index) => { sprout.target = 1.55 + index * .07; });
          createTreeCoinParty();
          celebrationSaving.textContent = `月々 ${formatYen(savedMonthly)} の節約`;
          celebrationAnnual.textContent = savedMonthly > 0
            ? `年間 ${formatYen(savedMonthly * 12)} が、あなたの未来に育ちます。`
            : '育てたいものを、すべて選びました。';
          playSound('jajean1');
          celebration.classList.add('visible');
          setTimeout(() => playSound('shine2', .9), 420);
        }, 1250);
      }

      function demolish(building) {
        if (!building || building.userData.destroyed || !destroyArmed) return;
        building.userData.destroyed = true;
        building.userData.decision = 'destroyed';
        destroyArmed = false;
        createExplosion(building);
        cameraShake = 1;
        playSound('big-explosion1');
        setTimeout(() => playSound('building-collapse-little1', .48), 300);
        flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
        building.visible = false;
        sheet.classList.remove('visible');
        createSprout(building);
        growSavingsTree();
        animateSavings(building.userData.sub.price);
        destroyedCount += 1;
        selected = null;
        updateDuplicateBadges();
        updateContractHeader();
        setTimeout(() => playSound('money-drop1', .9), 270);
        setTimeout(() => playSound('amount-display1', .78), 680);
        checkAllDecided();
      }

      function triggerHit() {
        const now = performance.now();
        if (now - lastHitAt < 500) return;
        lastHitAt = now;
        if (selected && !selected.userData.destroyed && destroyArmed) demolish(selected);
      }

      function handleMotion(event) {
        let acceleration = event.acceleration;
        let fallback = false;
        if (!acceleration || acceleration.x == null || acceleration.y == null || acceleration.z == null) {
          acceleration = event.accelerationIncludingGravity;
          fallback = true;
        }
        if (!acceleration || acceleration.x == null || acceleration.y == null || acceleration.z == null) return;
        const magnitude = Math.hypot(acceleration.x, acceleration.y, acceleration.z);
        if (fallback) motionStatus.textContent = '・重力込みモーション計測中';
        if (magnitude > 25) triggerHit();
      }

      async function startExperience() {
        if (started) return;
        started = true;
        startButton.disabled = true;
        startButton.textContent = '準備中…';
        const resumePromise = audioContext ? audioContext.resume() : Promise.resolve();
        let permission = '不要';
        try {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            permission = await DeviceMotionEvent.requestPermission();
          }
          await Promise.allSettled([resumePromise, audioBuffersReady]);
          if (permission !== 'denied' && typeof DeviceMotionEvent !== 'undefined') {
            if (!listening) window.addEventListener('devicemotion', handleMotion);
            listening = true;
            motionStatus.textContent = '・スマホを叩きつけて爆破';
          } else {
            motionStatus.textContent = '・PCはダブルクリックで爆破';
          }
        } catch (error) {
          await Promise.allSettled([resumePromise, audioBuffersReady]);
          motionStatus.textContent = '・ダブルクリックでも爆破できます';
        }
        titleScreen.classList.add('hidden');
        setTimeout(() => selectBuilding(buildings[0]), 850);
      }
      startButton.addEventListener('click', startExperience);

      const clock = new THREE.Clock();
      function render(now) {
        requestAnimationFrame(render);
        const dt = Math.min(clock.getDelta(), .035);
        const time = now * .001;
        buildings.forEach(building => {
          if (building === selected && !building.userData.destroyed) {
            building.position.x = building.userData.baseX + Math.sin(time * 22) * .055;
            building.rotation.z = Math.sin(time * 18) * .018;
            building.userData.halo.material.opacity = .62 + Math.sin(time * 5) * .25;
          } else {
            building.position.x = building.userData.baseX;
            building.rotation.z = 0;
          }
          const badge = building.userData.duplicateBadge;
          if (badge && badge.visible) badge.position.y = badge.userData.baseY + Math.sin(time * 3.2 + building.userData.index) * .12;
          const keepDecoration = building.userData.keepDecoration;
          if (keepDecoration && keepDecoration.visible) {
            const keepAge = Math.min(1, (performance.now() - keepDecoration.userData.born) / 560);
            const keepBounce = 1 + Math.sin(keepAge * Math.PI * 3) * (1 - keepAge) * .2;
            keepDecoration.scale.setScalar(Math.max(.01, keepAge * keepBounce));
            keepDecoration.rotation.y = time * .35;
          }
        });
        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const particle = particles[i];
          particle.life -= dt;
          if (particle.light) particle.light.intensity *= .82;
          if (particle.mesh) {
            particle.velocity.y -= 13 * dt;
            particle.mesh.position.addScaledVector(particle.velocity, dt);
            particle.mesh.rotation.x += particle.spin.x * dt;
            particle.mesh.rotation.y += particle.spin.y * dt;
            particle.mesh.rotation.z += particle.spin.z * dt;
            if (particle.life < .35) particle.mesh.scale.multiplyScalar(.9);
          }
          if (particle.life <= 0) {
            if (particle.mesh) scene.remove(particle.mesh);
            if (particle.light) scene.remove(particle.light);
            particles.splice(i, 1);
          }
        }
        sprouts.forEach(sprout => {
          const age = Math.min(1, (performance.now() - sprout.born) / 520);
          const bounce = 1 + Math.sin(age * Math.PI * 3) * (1 - age) * .18;
          const scale = Math.max(.01, age * sprout.target * bounce);
          sprout.group.scale.setScalar(scale);
          sprout.group.rotation.y = Math.sin(time * 1.5) * .12;
        });
        const treeAge = Math.min(1, (performance.now() - treeGrowthStarted) / 620);
        const treeBounce = 1 + Math.sin(treeAge * Math.PI * 3) * (1 - treeAge) * .2;
        savingsTree.scale.setScalar(Math.max(.08, treeAge * treeBounce));
        savingsTree.rotation.y = Math.sin(time * 1.15) * .045;
        treePartyCoins.forEach(coin => {
          coin.angle += dt * coin.speed;
          const lift = (time * coin.rise + coin.phase) % 1;
          coin.mesh.position.set(
            savingsTree.position.x + Math.cos(coin.angle) * coin.radius,
            .7 + lift * 4.6,
            savingsTree.position.z + Math.sin(coin.angle) * coin.radius
          );
          coin.mesh.rotation.x += dt * 7;
          coin.mesh.rotation.y += dt * 10;
        });
        if (cameraShake > .01) {
          camera.position.x = (Math.random() - .5) * cameraShake;
          camera.position.y = 14.2 + (Math.random() - .5) * cameraShake;
          cameraShake *= .82;
        } else {
          camera.position.x += (0 - camera.position.x) * .1;
          camera.position.y += (14.2 - camera.position.y) * .1;
        }
        camera.lookAt(0, 2.4, 0);
        // 0幅で初期化された場合(非表示タブ読込等)の自己修復
        if (renderer.domElement.width === 0 && innerWidth > 0) dispatchEvent(new Event('resize'));
        renderer.render(scene, camera);
      }
      requestAnimationFrame(render);

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.position.z = camera.aspect < .7 ? 39 : 29;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
      });
    })();
  </script>
</body>
</html>
