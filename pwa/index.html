<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#4aa3e8">
  <title>ZenCut</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      --ink: #fff8df;
      --gold: #ffd34d;
      --glass: rgba(20, 14, 62, .78);
      /* SimCity2000風パネル配色 */
      --steel-hi: #f2f4fa;
      --steel-lo: #4e5364;
      --steel-face: linear-gradient(#c6cad7, #a3a9ba);
      --steel-outline: #171a24;
      --titlebar: linear-gradient(#4a7de0, #22408e);
      --lcd-bg: #071a0c;
      --lcd-green: #56ff8d;
      --panel-text: #23283a;
      --mono: "Courier New", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #4aa3e8; }
    body { color: var(--ink); touch-action: none; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    /* 共通: SimCity風ウィンドウのタイトルバー */
    .sc-titlebar {
      display: block; margin: 0; padding: 6px 10px 5px;
      background: var(--titlebar); color: #fff;
      font-size: .82rem; font-weight: 1000; letter-spacing: .14em; text-align: left;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, .45);
      border-bottom: 2px solid var(--steel-lo); box-shadow: inset 0 1px rgba(255, 255, 255, .35);
    }
    #stage, #stage canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #stage { background: linear-gradient(#3f97e0 0%, #74bdf0 38%, #c3e6fb 62%, #e8f6d8 74%, #6fae58 100%); }

    #title-screen {
      position: fixed; z-index: 20; inset: 0; display: grid; place-items: end center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(44px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(17, 11, 56, .05), rgba(17, 11, 56, .15) 45%, rgba(12, 9, 42, .9)),
                  url('./assets/title.png') center 44% / cover no-repeat;
      transition: opacity .55s ease, visibility .55s;
    }
    #title-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .title-card { width: min(100%, 430px); text-align: center; filter: drop-shadow(0 5px 10px #171342); }
    .logo { margin: 0; font-size: clamp(3.8rem, 16vw, 6.2rem); font-weight: 1000; letter-spacing: -.08em; line-height: .92; }
    .logo span { color: var(--gold); }
    .tagline { margin: 12px 0 22px; font-weight: 800; letter-spacing: .12em; text-shadow: 0 2px 8px #171342; }
    #start {
      width: min(88%, 330px); min-height: 64px; cursor: pointer;
      border: 4px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      border-radius: 2px; color: #1a3a1e; background: linear-gradient(#b6e8a8, #6fc45f);
      font-size: 1.25rem; font-weight: 1000; letter-spacing: .1em;
      box-shadow: 0 0 0 2px var(--steel-outline), 0 8px 0 rgba(10, 12, 24, .55), 0 14px 30px rgba(0,0,0,.35);
      text-shadow: 1px 1px 0 rgba(255, 255, 255, .45);
    }
    #start:active {
      transform: translateY(5px);
      border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      box-shadow: 0 0 0 2px var(--steel-outline), 0 3px 0 rgba(10, 12, 24, .55);
    }

    #opening {
      position: fixed; z-index: 19; inset: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 42%, rgba(140,196,240,.96), rgba(58,124,190,.98) 66%);
      opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s, background .45s;
    }
    #opening.visible { opacity: 1; visibility: visible; pointer-events: auto; }
    #opening.building { background: rgba(120,180,235,.08); }
    .scan-card {
      width: min(88vw, 390px); padding: 0 0 20px; text-align: center;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      background: var(--steel-face); border-radius: 2px;
      box-shadow: 0 0 0 2px var(--steel-outline), 0 18px 55px rgba(0,0,0,.42);
      transition: transform .45s ease, opacity .45s;
    }
    #opening.building .scan-card { transform: translateY(31vh) scale(.84); opacity: .92; }
    #scan-message { margin: 16px 14px 0; color: var(--panel-text); font-size: clamp(1.05rem, 4.6vw, 1.4rem); font-weight: 1000; }
    #mail-count {
      margin: 14px auto 6px; padding: 6px 20px; width: max-content; min-width: 130px;
      font-size: 2.4rem; line-height: 1.15;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); color: var(--lcd-green);
      font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums;
      text-shadow: 0 0 7px rgba(86, 255, 141, .55);
    }
    #mail-label { margin: 0; color: #3c4257; font-size: .84rem; font-weight: 700; }
    #skip-note { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); color: rgba(255,255,255,.9); text-shadow: 0 1px 3px rgba(20,40,70,.5); font-size: .72rem; }

    #hud {
      position: fixed; z-index: 5; top: 0; left: 0; right: 0; pointer-events: none;
      padding: max(10px, env(safe-area-inset-top)) 12px 0;
      display: flex; justify-content: center;
    }
    .counter {
      min-width: min(94vw, 390px); padding: 7px 10px 7px; text-align: center;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      background: var(--steel-face); border-radius: 2px;
      box-shadow: 0 0 0 2px var(--steel-outline), 0 7px 25px rgba(5,4,30,.4);
      color: var(--panel-text);
    }
    .counter-main {
      display: block; padding: 4px 10px; font-size: clamp(.88rem, 3.8vw, 1.06rem); font-weight: 700;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); color: var(--lcd-green);
      font-family: var(--mono); text-shadow: 0 0 7px rgba(86, 255, 141, .5);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #contract-total { font-size: 1.08em; font-weight: 700; font-variant-numeric: tabular-nums; }
    #monthly { display: inline-block; color: #ffe066; text-shadow: 0 0 7px rgba(255, 224, 102, .6); font-size: 1.22em; font-weight: 700; font-variant-numeric: tabular-nums; }
    #monthly.bump { animation: bump .55s ease; }
    .counter-sub {
      display: block; margin-top: 4px; padding: 3px 10px; font-size: .74rem; letter-spacing: .08em;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); color: #ffe066;
      font-family: var(--mono); font-weight: 700; text-shadow: 0 0 6px rgba(255, 224, 102, .5);
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }

    #hint {
      position: fixed; z-index: 5; top: max(96px, calc(env(safe-area-inset-top) + 88px)); left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 90vw; padding: 5px 12px; border-radius: 2px;
      border: 2px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      background: linear-gradient(#fdf6cf, #f0e3a0); box-shadow: 0 0 0 1px var(--steel-outline), 0 4px 12px rgba(5,4,30,.35);
      color: #4a3d14; font-size: .72rem; font-weight: 700; text-align: center; pointer-events: none; transition: opacity .3s;
    }
    #motion-status { color: #a1541c; }

    #sheet {
      position: fixed; z-index: 8; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom));
      margin: auto; width: min(calc(100% - 20px), 520px); padding: 0 0 12px;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      border-radius: 2px; background: var(--steel-face);
      box-shadow: 0 0 0 2px var(--steel-outline), 0 12px 40px rgba(4,3,27,.48);
      text-align: center; transform: translateY(calc(100% + 28px)); opacity: 0; transition: .28s cubic-bezier(.2,.9,.2,1.1); pointer-events: none;
    }
    #sheet.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
    #sheet-title {
      margin: 0 0 10px; padding: 7px 12px 6px; text-align: left;
      background: var(--titlebar); color: #fff; font-size: 1.02rem; font-weight: 1000; letter-spacing: .06em;
      text-shadow: 1px 1px 0 rgba(0,0,0,.45); border-bottom: 2px solid var(--steel-lo);
      box-shadow: inset 0 1px rgba(255,255,255,.35);
    }
    #sheet-detail { margin: 0 14px 10px; color: #343a4e; font-size: .91rem; font-weight: 700; }
    #sheet-action {
      margin: 10px 14px 2px; padding: 6px 8px; color: #ffe066; font-size: 1rem; font-weight: 700;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); font-family: var(--mono); text-shadow: 0 0 7px rgba(255, 224, 102, .55);
      animation: pulse 1s ease-in-out infinite;
    }
    #sheet-action[hidden], #sheet-choices[hidden], #cancel-keep[hidden] { display: none; }
    #sheet-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 14px; }
    .choice-button, #cancel-keep {
      min-height: 52px; border-radius: 2px; cursor: pointer; touch-action: manipulation;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      box-shadow: 0 0 0 1px var(--steel-outline), 0 3px 0 rgba(10,12,24,.4);
      font-weight: 1000; text-shadow: 1px 1px 0 rgba(255,255,255,.4);
    }
    .choice-button:active, #cancel-keep:active {
      transform: translateY(2px);
      border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      box-shadow: 0 0 0 1px var(--steel-outline), 0 1px 0 rgba(10,12,24,.4);
    }
    #keep-button { background: linear-gradient(#b6e8a8, #6fc45f); color: #1a3a1e; }
    #destroy-button { background: linear-gradient(#f6b48c, #e05a3a); color: #4a130a; }
    #cancel-keep { width: calc(100% - 28px); margin: 10px 14px 0; background: var(--steel-face); color: var(--panel-text); }

    #flash { position: fixed; z-index: 7; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle, #fffde0, #ffbf24 28%, #ff4d00 58%, transparent 73%); mix-blend-mode: screen; }
    #flash.go { animation: flash .44s ease-out; }
    #cancel-stamp {
      position: fixed; z-index: 14; top: 44%; left: 50%; padding: 8px 18px; border: 7px double #e52c35; border-radius: 12px;
      color: #e52c35; background: rgba(255,245,221,.9); font-size: clamp(2.8rem, 15vw, 5.8rem); font-weight: 1000;
      letter-spacing: .08em; line-height: 1; opacity: 0; pointer-events: none; transform: translate(-50%, -50%) rotate(-12deg) scale(2.4);
      text-shadow: 2px 2px 0 rgba(255,255,255,.8); box-shadow: 0 4px 18px rgba(75,0,12,.4);
    }
    #cancel-stamp.go { animation: stamp-in .8s cubic-bezier(.15,.85,.2,1); }

    #celebration {
      position: fixed; z-index: 15; inset: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 56%, rgba(255,225,120,.4), rgba(90,160,215,.8) 52%, rgba(45,100,160,.94));
      opacity: 0; visibility: hidden; transition: opacity .7s, visibility .7s; pointer-events: none;
    }
    #celebration.visible { opacity: 1; visibility: visible; pointer-events: auto; }
    .celebrate-card {
      text-align: center; width: min(92vw, 440px); padding: 0 0 22px;
      border: 3px solid; border-color: var(--steel-hi) var(--steel-lo) var(--steel-lo) var(--steel-hi);
      background: var(--steel-face); border-radius: 2px;
      box-shadow: 0 0 0 2px var(--steel-outline), 0 18px 55px rgba(0,0,0,.5);
      color: var(--panel-text);
    }
    #celebration.visible .celebrate-card { animation: rise .8s cubic-bezier(.2,.9,.2,1.2); }
    .celebrate-icon { margin-top: 14px; font-size: clamp(4rem, 20vw, 7rem); filter: drop-shadow(0 0 25px #ffc928); }
    .celebrate-card h2 { margin: 8px 16px; font-size: clamp(1.35rem, 5.6vw, 2.2rem); line-height: 1.25; color: var(--panel-text); }
    .celebrate-card strong {
      display: block; width: max-content; max-width: 92%; margin: 10px auto 0; padding: 6px 16px;
      border: 2px solid; border-color: var(--steel-lo) var(--steel-hi) var(--steel-hi) var(--steel-lo);
      background: var(--lcd-bg); color: #ffe066; font-family: var(--mono); font-size: 1.05em;
      text-shadow: 0 0 8px rgba(255, 224, 102, .6); font-variant-numeric: tabular-nums;
    }
    .celebrate-card p { margin: 14px 16px 0; color: #3c4257; font-weight: 700; }

    @keyframes bump { 35% { transform: scale(1.38) rotate(-2deg); color: #fff; } }
    @keyframes pulse { 50% { transform: scale(1.04); filter: brightness(1.3); } }
    @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes stamp-in {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(-17deg) scale(2.4); }
      16% { opacity: 1; transform: translate(-50%, -50%) rotate(-10deg) scale(.84); }
      29% { transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
      78% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) rotate(-12deg) scale(1.04); }
    }
    @keyframes rise { from { transform: translateY(50px) scale(.7); opacity: 0; } }
    @media (min-width: 720px) { #hint { font-size: .8rem; } }
  </style>
</head>
<body>
  <div id="stage" aria-label="サブスクリプションのビル街"></div>

  <section id="opening" aria-live="polite">
    <div class="scan-card">
      <span class="sc-titlebar">📡 GMAIL スキャン</span>
      <p id="scan-message">📩 Gmailをスキャン中…</p>
      <div id="mail-count">0</div>
      <p id="mail-label">請求メールを確認しています</p>
    </div>
    <div id="skip-note">画面をタップしてスキップ</div>
  </section>

  <header id="hud">
    <div class="counter">
      <div class="counter-main">契約中 <span id="active-count">0本</span>　月額合計 <span id="contract-total">¥0</span></div>
      <div class="counter-sub">▼<span id="monthly">¥0</span> 節約　年間 <span id="annual">¥0</span></div>
    </div>
  </header>
  <div id="hint">ドラッグで惑星を回転・ビルをタップして選択 <span id="motion-status">・PCはダブルクリックで爆破</span></div>

  <aside id="sheet" aria-live="polite">
    <h2 id="sheet-title"></h2>
    <p id="sheet-detail"></p>
    <div id="sheet-choices">
      <button id="keep-button" class="choice-button" type="button">🌱 育てる</button>
      <button id="destroy-button" class="choice-button" type="button">💥 叩き壊す</button>
    </div>
    <button id="cancel-keep" type="button" hidden>育成を取り消す</button>
    <p id="sheet-action" hidden>📱 振りかぶって叩きつけろ！</p>
  </aside>
  <div id="flash"></div>
  <div id="cancel-stamp" aria-hidden="true">解約!</div>

  <section id="celebration" aria-live="assertive">
    <div class="celebrate-card">
      <span class="sc-titlebar">🏛 市長への報告書</span>
      <div class="celebrate-icon">🌱</div>
      <h2>あなたの街が、整いました。<strong id="celebration-saving">月々 ¥0 の節約</strong></h2>
      <p id="celebration-annual">育てるものと手放すものを、選びました。</p>
    </div>
  </section>

  <section id="title-screen">
    <div class="title-card">
      <h1 class="logo">Zen<span>Cut</span></h1>
      <p class="tagline">サブスクを壊して、未来を育てよう。</p>
      <button id="start" type="button">はじめる</button>
    </div>
  </section>

  <script src="./three.min.js"></script>

      // 平面レイアウト座標(x, z)を球面上の位置・姿勢に変換して配置する
      function placeOnPlanet(object, x, z, lift = 0) {
        const dist = Math.hypot(x, z);

        object.quaternion.copy(orientation);

          const k = Math.round(((angle + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2 / THETA_SEGMENTS)) % THETA_SEGMENTS;
          const px = vx * (width / 2) * bumps[k];

        const shore = new THREE.Mesh(
          createDistrictZoneGeometry(size * 1.45, size * 1.18),
          new THREE.MeshStandardMaterial({ color: 0xd9c98a, roughness: .95 })

          createDistrictZoneGeometry(size, size * .8),
          new THREE.MeshStandardMaterial({ color: 0x3fa2dd, roughness: .16, metalness: .06 })

        placeOnPlanet(water, x, z, .035);
        water.rotateX(-Math.PI / 2);

          const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(.13 + Math.random() * .16), rockMaterial);

      function createMountains(x, z) {
        for (let i = 0; i < 5; i += 1) {
          const height = 1.1 + Math.random() * 1.6;
          const peak = new THREE.Group();
          const rock = new THREE.Mesh(new THREE.ConeGeometry(.5 + height * .45, height, 7), rockMaterial);

      function createFarm(x, z) {
        const canvas = document.createElement('canvas');

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const field = new THREE.Mesh(bentPlaneGeometry(3.9, 2.9), new THREE.MeshStandardMaterial({ map: texture, roughness: .92 }));
        placeOnPlanet(field, x, z, .02);
        field.rotateX(-Math.PI / 2);
        field.rotateZ(.4);
        createHouse(x + 2.2, z - 1.4, 1.25, 0xc94f3e);

      const houseBodyColors = [0xf2e3c2, 0xe8b57c, 0xd8756a, 0xc9dbe8];
      function createHouse(x, z, scale = 1, bodyColor) {
        const house = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(.58, .42, .5),
          new THREE.MeshStandardMaterial({ color: bodyColor ?? houseBodyColors[Math.floor(Math.random() * houseBodyColors.length)], roughness: .82 })

        body.position.y = .21;
        body.castShadow = true;
        house.add(body);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(.46, .34, 4), new THREE.MeshStandardMaterial({ color: 0xa8523d, roughness: .78 }));
        roof.position.y = .59;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        house.add(roof);
        house.scale.setScalar(scale);
        placeOnPlanet(house, x, z, 0);
        house.rotateY(Math.random() * Math.PI * 2);
      }

      function createVillage(x, z) {
        for (let i = 0; i < 6; i += 1) {
          const angle = i / 6 * Math.PI * 2 + Math.random() * .5;
          const radius = .9 + Math.random() * 1.3;
          createHouse(x + Math.cos(angle) * radius, z + Math.sin(angle) * radius, .9 + Math.random() * .4);
        }
      }

      function createMeadow(x, z) {
        const flowerColors = [0xff8fb3, 0xffe066, 0xffffff, 0xff9a5c];
        for (let i = 0; i < 36; i += 1) {
          const flower = new THREE.Mesh(
            new THREE.SphereGeometry(.055 + Math.random() * .04, 6, 5),
            new THREE.MeshStandardMaterial({ color: flowerColors[i % flowerColors.length], roughness: .6, emissive: flowerColors[i % flowerColors.length], emissiveIntensity: .12 })
          );
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.sqrt(Math.random()) * 2.3;
          placeOnPlanet(flower, x + Math.cos(angle) * radius, z + Math.sin(angle) * radius, .06);
        }
      }

      // featureZonesの座標と対応させて配置(木はそこを避けて生えている)
      createLake(2, 16, 4.6);
      createLake(-2, -14, 2.1);
      createMountains(-21, -13);
      createFarm(-22, 8);
      createVillage(9, 22);
      createMeadow(17, 13);
      // 公園ブロックには木を植えて憩いの場に
      parkBlocks.forEach(park => {
        for (let i = 0; i < 6; i += 1) {
          plantTree(
            park.center[0] + (Math.random() - .5) * (park.size[0] - 1.6),
            park.center[1] + (Math.random() - .5) * (park.size[1] - 1.6),
            i
          );
        }
      });

      // 昼空: 星の代わりにぽっかり浮かぶ雲
      const cloudMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .88, fog: false });
      for (let i = 0; i < 7; i += 1) {
        const cloud = new THREE.Group();
        const puffCount = 3 + (i % 3);
        for (let p = 0; p < puffCount; p += 1) {
          const puff = new THREE.Mesh(new THREE.SphereGeometry(.65 + Math.random() * .55, 10, 8), cloudMaterial);
          puff.position.set(p * .85 - puffCount * .4, Math.random() * .25, Math.random() * .3);
          puff.scale.y = .55;
          cloud.add(puff);
        }
        cloud.position.set((Math.random() - .5) * 30, 9 + Math.random() * 7, -8 - Math.random() * 8);
        scene.add(cloud);
      }

      const fillerHouseMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: .8, metalness: 0 });
      const fillerWindowMaterial = new THREE.MeshStandardMaterial({ color: 0xfff0b2, emissive: 0xffa52f, emissiveIntensity: 1.8, roughness: .45 });
      const fillerTrunkMaterial = new THREE.MeshStandardMaterial({ color: 0x765037, roughness: .95 });
      const fillerLeafMaterial = new THREE.MeshStandardMaterial({ color: 0x58a976, vertexColors: true, roughness: .9 });
      const fillerHouseIM = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), fillerHouseMaterial, 40);
      const fillerWindowIM = new THREE.InstancedMesh(new THREE.BoxGeometry(.34, .18, .04), fillerWindowMaterial, 40);
      const fillerTrunkIM = new THREE.InstancedMesh(new THREE.CylinderGeometry(.09, .13, 1, 5), fillerTrunkMaterial, 40);
      const fillerLeafIM = new THREE.InstancedMesh(new THREE.ConeGeometry(.54, 1, 6), fillerLeafMaterial, 40);
      [fillerHouseIM, fillerWindowIM, fillerTrunkIM, fillerLeafIM].forEach(mesh => {
        mesh.castShadow = false;
        mesh.receiveShadow = false;
        mesh.userData.filler = true;
        scene.add(mesh);
      });
      const fillerMatrix = new THREE.Matrix4();
      const fillerQuaternion = new THREE.Quaternion();
      const fillerPosition = new THREE.Vector3();
      const fillerScale = new THREE.Vector3();
      const fillerOffset = new THREE.Vector3();
      const fillerColor = new THREE.Color();
      const housePalette = [0xf5d2c2, 0xe6c8e7, 0xc8dcf0, 0xcce8d3, 0xf7e1ae, 0xe1cff5];
      const leafPalette = [0x4f9a68, 0x62ae76, 0x73b982, 0x478e70];
      let fillerHouseCount = 0;
      let fillerTreeCount = 0;
      function addFillerHouse(x, z, rotation, height, color) {
        if (fillerHouseCount >= 40) return;
        fillerQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rotation);
        fillerPosition.set(x, height / 2 + .08, z);
        fillerScale.set(1.05, height, .9);
        fillerHouseIM.setMatrixAt(fillerHouseCount, fillerMatrix.compose(fillerPosition, fillerQuaternion, fillerScale));
        fillerHouseIM.setColorAt(fillerHouseCount, fillerColor.setHex(color));
        fillerOffset.set(0, height * .58, .47).applyQuaternion(fillerQuaternion).add(fillerPosition);
        fillerScale.set(1, 1, 1);
        fillerWindowIM.setMatrixAt(fillerHouseCount, fillerMatrix.compose(fillerOffset, fillerQuaternion, fillerScale));
        fillerHouseCount += 1;
      }
      function addFillerTree(x, z, height, color) {
        if (fillerTreeCount >= 40) return;
        fillerPosition.set(x, height * .32 + .08, z);
        fillerScale.set(1, height * .64, 1);
        fillerTrunkIM.setMatrixAt(fillerTreeCount, fillerMatrix.compose(fillerPosition, fillerQuaternion, fillerScale));
        fillerPosition.set(x, height * .86 + .08, z);
        fillerScale.set(height * .68, height * .92, height * .68);
        fillerLeafIM.setMatrixAt(fillerTreeCount, fillerMatrix.compose(fillerPosition, fillerQuaternion, fillerScale));
        fillerLeafIM.setColorAt(fillerTreeCount, fillerColor.setHex(color));
        fillerTreeCount += 1;
      }
      parkBlocks.forEach((block, blockIndex) => {
        const [cx, cz] = block.center;
        [[-1.8, -1.8], [0, -1.8], [1.8, -1.8], [-1.8, -.15], [1.8, -.15]].forEach(([x, z], index) => {
          addFillerHouse(cx + x, cz + z, (index + blockIndex) % 2 ? .12 : -.12, 1.05 + (index % 2) * .18, housePalette[(index + blockIndex * 2) % housePalette.length]);
        });
        [[-1.75, 1.75], [0, 1.75], [1.75, 1.75], [0, .55]].forEach(([x, z], index) => {
          addFillerTree(cx + x, cz + z, 1.05 + (index % 2) * .22, leafPalette[(index + blockIndex) % leafPalette.length]);
        });
      });
      fillerHouseIM.count = fillerHouseCount;
      fillerWindowIM.count = fillerHouseCount;
      fillerTrunkIM.count = fillerTreeCount;
      fillerLeafIM.count = fillerTreeCount;
      [fillerHouseIM, fillerWindowIM, fillerTrunkIM, fillerLeafIM].forEach(mesh => {
        mesh.instanceMatrix.needsUpdate = true;
        if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      });

      const carBodyMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: .55, metalness: .08 });
      const carTopMaterial = new THREE.MeshStandardMaterial({ color: 0xbed5e4, vertexColors: true, roughness: .45, metalness: .04 });
      const carBodyIM = new THREE.InstancedMesh(new THREE.BoxGeometry(.7, .28, 1.15), carBodyMaterial, 4);
      const carTopIM = new THREE.InstancedMesh(new THREE.BoxGeometry(.54, .22, .54), carTopMaterial, 4);
      carBodyIM.userData.filler = true;
      carTopIM.userData.filler = true;
      carBodyIM.castShadow = false; carBodyIM.receiveShadow = false;
      carTopIM.castShadow = false; carTopIM.receiveShadow = false;
      scene.add(carBodyIM); scene.add(carTopIM);
      const cars = [
        { axis: 'x', lane: -3, phase: 1.2, speed: 2.4, direction: 1, color: 0xf2756b },
        { axis: 'x', lane: 3, phase: 16.4, speed: 2.1, direction: -1, color: 0x7ac9ea },
        { axis: 'z', lane: -9, phase: 5.1, speed: 2.0, direction: 1, color: 0xffd36b },
        { axis: 'z', lane: 9, phase: 13.2, speed: 2.3, direction: -1, color: 0xb8e58b }
      ];
      cars.forEach((car, index) => {
        carBodyIM.setColorAt(index, fillerColor.setHex(car.color));
        carTopIM.setColorAt(index, fillerColor.setHex(car.color));
      });
      carBodyIM.instanceMatrix.needsUpdate = true;
      carTopIM.instanceMatrix.needsUpdate = true;
      carBodyIM.instanceColor.needsUpdate = true;
      carTopIM.instanceColor.needsUpdate = true;
      const carQuaternion = new THREE.Quaternion();
      const carPosition = new THREE.Vector3();
      const carTopPosition = new THREE.Vector3();
      const carUnitScale = new THREE.Vector3(1, 1, 1);
      const carTopScale = new THREE.Vector3(.92, .82, .92);
      function updateCars(time) {
        cars.forEach((car, index) => {
          const travel = (car.phase + time * car.speed * car.direction) % (car.axis === 'x' ? 30 : 18);
          const distance = travel < 0 ? travel + (car.axis === 'x' ? 30 : 18) : travel;
          const angle = car.axis === 'x'
            ? (car.direction > 0 ? 0 : Math.PI)
            : (car.direction > 0 ? Math.PI / 2 : -Math.PI / 2);
          carQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle);
          if (car.axis === 'x') carPosition.set(distance - 15, .29, car.lane);
          else carPosition.set(car.lane, .29, distance - 9);
          carBodyIM.setMatrixAt(index, fillerMatrix.compose(carPosition, carQuaternion, carUnitScale));
          carTopPosition.set(0, .22, -.07).applyQuaternion(carQuaternion).add(carPosition);
          carTopIM.setMatrixAt(index, fillerMatrix.compose(carTopPosition, carQuaternion, carTopScale));
        });
        carBodyIM.instanceMatrix.needsUpdate = true;
        carTopIM.instanceMatrix.needsUpdate = true;
      }
      updateCars(0);

      const buildings = [];
      const clickableMeshes = [];
      const particles = [];
      const treePartyCoins = [];
      const savingsTree = new THREE.Group();
      const treeGold = new THREE.MeshStandardMaterial({ color: 0xffc52f, emissive: 0xff8b0b, emissiveIntensity: 1.15, metalness: .42, roughness: .3 });
      const treeLightGold = new THREE.MeshStandardMaterial({ color: 0xffed72, emissive: 0xffb51f, emissiveIntensity: 1.7, metalness: .25, roughness: .26 });
      let treeStage = 0;
      let treeGrowthStarted = performance.now();
      let selected = null;
      let destroyArmed = false;
      let celebrationShown = false;
      let celebrationTimer = null;
      let savedMonthly = 0;
      let destroyedCount = 0;
      let cameraShake = 0;
      let listening = false;
      let started = false;
      let openingRunning = false;
      let openingInterval = null;
      const openingTimers = [];
      let treeVisible = false;
      let cameraDistance = innerWidth / innerHeight < .7 ? 62 : 52;
      let pinchActive = false;
      let pinchStartDistance = 0;
      let pinchStartCameraDistance = cameraDistance;
      let suppressTapUntil = 0;
      let viewTween = null;
      const cameraView = { distance: cameraDistance, targetX: 0, targetY: 1.5, targetZ: 0 };

      function roundedBox(width, height, depth, color, y, bevel = .08, detailed = true) {
        const segments = detailed ? 2 : 1;
        const geometry = new THREE.BoxGeometry(width, height, depth, segments, segments, segments);
        const position = geometry.attributes.position;
        for (let i = 0; i < position.count; i += 1) {
          const x = position.getX(i), z = position.getZ(i);
          const scale = 1 - bevel * Math.max(0, Math.abs(position.getY(i)) / (height / 2));
          position.setXYZ(i, x * scale, position.getY(i), z * scale);
        }
        geometry.computeVertexNormals();
        const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color, roughness: .58, metalness: .12 }));
        mesh.position.y = y;
        mesh.castShadow = detailed;
        mesh.receiveShadow = true;
        return mesh;
      }

      function createSign(sub) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 256;
        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 512, 256);
        gradient.addColorStop(0, sub.contracted ? '#291d65' : '#4d4b55');
        gradient.addColorStop(1, sub.contracted ? '#6941aa' : '#77737d');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, 512, 256);
        ctx.strokeStyle = sub.contracted ? '#ffd65c' : '#aaa5af'; ctx.lineWidth = 13; ctx.strokeRect(8, 8, 496, 240);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '86px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(sub.icon, 92, 114);
        ctx.font = `900 ${sub.name.length > 7 ? 45 : 55}px sans-serif`; ctx.fillText(sub.name, 320, 87);
        ctx.font = '700 38px sans-serif'; ctx.fillStyle = sub.contracted ? '#ffe47d' : '#ddd9df';
        ctx.fillText(sub.contracted ? `${formatYen(sub.price)}/mo` : '未契約', 320, 164);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.22, .61), new THREE.MeshBasicMaterial({ map: texture, transparent: true }));
        sign.position.z = .56;
        return sign;
      }

      function addWindows(group, width, height, baseY, sub) {
        const rows = Math.max(1, Math.floor(height / .62));
        const cols = 2;
        const material = sub.contracted
          ? new THREE.MeshStandardMaterial({ color: 0xffe16a, emissive: 0xff9d23, emissiveIntensity: 2.1 })
          : new THREE.MeshStandardMaterial({ color: 0x555665, emissive: 0x151620, emissiveIntensity: .15 });
        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < cols; col += 1) {
            if ((row + col + sub.months) % 5 === 0) continue;
            const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(.19, .17, .035), material);
            windowMesh.position.set((col - .5) * .38, baseY - height / 2 + .38 + row * .48, .558);
            group.add(windowMesh);
          }
        }
      }

      function createBuilding(sub, index) {
        const paid = sub.price * sub.months;
        const height = sub.contracted ? 1.75 + Math.sqrt(paid / 140400) * 4.15 : 1.35;
        const detailed = sub.contracted;
        const group = new THREE.Group();
        placeOnPlanet(group, sub.position[0], sub.position[1], -.01);
        group.rotateY((Math.random() - .5) * .6);
        group.userData = { sub, index, destroyed: false, decision: null, baseQuaternion: group.quaternion.clone(), baseY: .18, height, duplicateBadge: null, keepDecoration: null, buildBorn: null };
        group.scale.setScalar(.01);

        const bodyHeight = height - .72;
        const base = roundedBox(1.14, bodyHeight, 1.05, sub.color, bodyHeight / 2 + .08, detailed ? .08 : 0, detailed);
        base.castShadow = sub.contracted;
        base.userData.building = group;
        group.add(base);
        if (sub.contracted) clickableMeshes.push(base);
        group.userData.body = base;
        if (detailed) addWindows(group, 1.14, bodyHeight, bodyHeight / 2 + .08, sub);

        const upper = roundedBox(1.02, .72, .95, sub.dark, height - .3, detailed ? .08 : 0, detailed);
        upper.castShadow = sub.contracted;
        upper.userData.building = group;
        group.add(upper);
        if (sub.contracted) clickableMeshes.push(upper);
        const roof = roundedBox(.82, .18, .76, sub.contracted ? 0x413267 : 0x55545d, height + .14, detailed ? .04 : 0, detailed);
        roof.castShadow = sub.contracted;
        group.add(roof);
        if (detailed) {
          const cap = roundedBox(.43, .18, .4, sub.color, height + .32, .03);
          group.add(cap);
          const antenna = new THREE.Mesh(new THREE.CylinderGeometry(.025, .035, .38, 7), new THREE.MeshStandardMaterial({ color: 0xffd75e, emissive: 0xff8a1f, emissiveIntensity: 1.5 }));
          antenna.position.y = height + .6; group.add(antenna);
        }
        const sign = createSign(sub); sign.position.y = height - .3; sign.userData.building = group; group.add(sign);
        if (sub.contracted) clickableMeshes.push(sign);

        const halo = new THREE.Mesh(new THREE.RingGeometry(.73, .89, 24), new THREE.MeshBasicMaterial({ color: 0xffd54a, transparent: true, opacity: 0, side: THREE.DoubleSide }));
        halo.rotation.x = -Math.PI / 2; halo.position.y = .14; group.add(halo); group.userData.halo = halo;
        buildings.push(group);
      }
      subscriptions.forEach(createBuilding);

      function createDuplicateBadge(building) {
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 96;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#d9293f'; ctx.fillRect(4, 4, 248, 88);
        ctx.strokeStyle = '#fff0dc'; ctx.lineWidth = 7; ctx.strokeRect(4, 4, 248, 88);
        ctx.fillStyle = '#fff'; ctx.font = '900 40px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⚠ 重複', 128, 50);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const badge = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: true }));
        badge.scale.set(1.45, .54, 1);
        badge.userData.baseY = building.userData.height + 1.15;
        badge.position.y = badge.userData.baseY;
        badge.visible = false;
        building.add(badge);
        building.userData.duplicateBadge = badge;
      }

      // 怒れる住人: サブスクが重複している街区の路上に現れて抗議する
      const angryResidents = [];
      const residentSkinMaterial = new THREE.MeshStandardMaterial({ color: 0xf2c49b, roughness: .72 });
      const residentClothesColors = [0xe2574b, 0x3f7fd2, 0x4fa15a, 0xd9a03c, 0x9a5fd0];
      function createAngryMark() {
        const canvas = document.createElement('canvas');
        canvas.width = 128; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.font = '104px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('💢', 64, 70);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const mark = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: true }));
        mark.scale.set(.42, .42, 1);
        mark.position.y = .78;
        return mark;
      }
      function createAngryResident(district, offset, index) {
        const resident = new THREE.Group();
        const clothes = new THREE.MeshStandardMaterial({ color: residentClothesColors[(index + district.genre.length) % residentClothesColors.length], roughness: .78 });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(.1, .15, .34, 8), clothes);
        body.position.y = .19; body.castShadow = true; resident.add(body);
        const head = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), residentSkinMaterial);
        head.position.y = .48; resident.add(head);
        [-1, 1].forEach(side => {
          const arm = new THREE.Mesh(new THREE.CylinderGeometry(.032, .04, .24, 6), clothes);
          arm.position.set(side * .17, .36, 0);
          arm.rotation.z = side * -.52; // 両腕を振り上げた抗議ポーズ
          resident.add(arm);
          const fist = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 6), residentSkinMaterial);
          fist.position.set(side * .23, .47, 0);
          resident.add(fist);
        });
        const mark = createAngryMark();
        resident.add(mark);
        placeOnPlanet(resident, district.center[0] + offset[0], district.center[1] + offset[1], 0);
        resident.rotateY(Math.random() * Math.PI * 2);
        resident.visible = false;
        resident.userData = {
          genre: district.genre,
          phase: Math.random() * 6.3,
          basePosition: resident.position.clone(),
          up: resident.position.clone().normalize(),
          baseQuaternion: resident.quaternion.clone(),
          mark
        };
        angryResidents.push(resident);
      }
      districts.forEach(district => {
        [[-.7, .05], [.8, -.12], [.05, .95]].forEach((offset, index) => createAngryResident(district, offset, index));
      });

      function updateDuplicateBadges() {
        const activeByGenre = {};
        buildings.forEach(building => {
          const { sub, destroyed } = building.userData;
          if (sub.contracted && !destroyed) activeByGenre[sub.genre] = (activeByGenre[sub.genre] || 0) + 1;
        });
        buildings.forEach(building => {
          const { sub, destroyed, duplicateBadge } = building.userData;
          if (!duplicateBadge && sub.contracted) createDuplicateBadge(building);
          if (building.userData.duplicateBadge) building.userData.duplicateBadge.visible = !destroyed && activeByGenre[sub.genre] >= 2;
        });
        angryResidents.forEach(resident => {
          resident.visible = (activeByGenre[resident.userData.genre] || 0) >= 2;

      function addTreePart(geometry, material, position, scale, rotation) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(...position);

        mesh.castShadow = false;

      function rebuildSavingsTree(stage) {
        savingsTree.clear();
        const trunkHeight = .38 + stage * .43;
        addTreePart(new THREE.ConeGeometry(.5 + stage * .08, .2, 10), treeGold, [0, .1, 0]);
        addTreePart(new THREE.CylinderGeometry(.07 + stage * .035, .11 + stage * .055, trunkHeight, 9), treeGold, [0, .2 + trunkHeight / 2, 0]);

        if (stage === 0) {
          addTreePart(new THREE.SphereGeometry(.18, 10, 7), treeLightGold, [0, trunkHeight + .28, 0], [1, 1.25, 1]);
        } else {
          const leafCount = Math.min(6, stage + 1);
          for (let i = 0; i < leafCount; i += 1) {
            const side = i % 2 === 0 ? -1 : 1;
            const level = Math.floor(i / 2);
            const leafY = trunkHeight * (.58 + level * .16) + .22;
            addTreePart(
              new THREE.SphereGeometry(.3 + stage * .045, 10, 7),
              treeLightGold,
              [side * (.24 + level * .1), leafY, (i % 3 - 1) * .09],
              [1.15, .34, .64],
              [0, side * .22, side * -.48]
            );
          }
        }

        if (stage >= 2) {
          const branchCount = Math.min(5, stage + 1);
          for (let i = 0; i < branchCount; i += 1) {
            const angle = i / branchCount * Math.PI * 2;
            const branch = addTreePart(
              new THREE.CylinderGeometry(.035 + stage * .008, .055 + stage * .01, .65 + stage * .12, 7),
              treeGold,
              [Math.cos(angle) * .22, trunkHeight * .74, Math.sin(angle) * .22],
              null,
              [Math.sin(angle) * .82, 0, -Math.cos(angle) * .82]
            );
            branch.rotation.y = angle;
          }
        }

        if (stage >= 3) {
          const canopyCount = stage === 5 ? 7 : stage + 1;
          const radius = .5 + stage * .15;
          for (let i = 0; i < canopyCount; i += 1) {
            const angle = i / canopyCount * Math.PI * 2;
            const ring = i === canopyCount - 1 ? 0 : radius * .58;
            addTreePart(
              new THREE.SphereGeometry(radius, 10, 7),
              i % 2 ? treeGold : treeLightGold,
              [Math.cos(angle) * ring, trunkHeight + .42 + Math.sin(i * 1.7) * .2, Math.sin(angle) * ring],
              [1, .84, 1]
            );
          }
        }

        const glow = new THREE.PointLight(0xffc329, 14 + stage * 5, 5 + stage * 1.2);
        glow.position.y = trunkHeight + .55;
        savingsTree.add(glow);
        savingsTree.userData.stage = stage;
        savingsTree.userData.stageName = ['小さな芽', '芽', '双葉', '若木', '木', '大樹'][stage];
        savingsTree.scale.setScalar(.08);
        treeGrowthStarted = performance.now();
      }

      const raycaster = new THREE.Raycaster();

      // ドラッグで惑星を地球儀のように回す(タップ選択と区別するため移動量で判定)
      let dragPointerId = null;
      let lastDragX = 0, lastDragY = 0, dragTravel = 0;
      const dragAxis = new THREE.Vector3();
      const dragRotation = new THREE.Quaternion();
      function rotatePlanetBy(dx, dy) {
        const factor = .0042 * (cameraView.distance / 38);
        dragAxis.set(1, 0, 0).applyQuaternion(camera.quaternion);
        dragRotation.setFromAxisAngle(dragAxis, dy * factor);
        planet.quaternion.premultiply(dragRotation);
        dragAxis.set(0, 1, 0).applyQuaternion(camera.quaternion);
        dragRotation.setFromAxisAngle(dragAxis, dx * factor);
        planet.quaternion.premultiply(dragRotation);
      }
      renderer.domElement.addEventListener('pointerdown', event => {
        if (pinchActive) return;
        dragPointerId = event.pointerId;
        lastDragX = event.clientX; lastDragY = event.clientY; dragTravel = 0;
      });
      renderer.domElement.addEventListener('pointermove', event => {
        if (event.pointerId !== dragPointerId || pinchActive || openingRunning) return;
        const dx = event.clientX - lastDragX;
        const dy = event.clientY - lastDragY;
        lastDragX = event.clientX; lastDragY = event.clientY;
        dragTravel += Math.abs(dx) + Math.abs(dy);
        if (dragTravel < 7) return;
        suppressTapUntil = performance.now() + 350;
        planetTween = null;
        rotatePlanetBy(dx, dy);
      });
      renderer.domElement.addEventListener('pointercancel', () => { dragPointerId = null; });
      renderer.domElement.addEventListener('pointerup', event => {
        if (event.pointerId === dragPointerId) dragPointerId = null;
      });

      function pinchDistance(touches) {
        return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
      }

      renderer.domElement.addEventListener('touchstart', event => {
        if (event.touches.length !== 2) return;
        pinchActive = true;
        pinchStartDistance = pinchDistance(event.touches);
        pinchStartCameraDistance = cameraDistance;
        suppressTapUntil = performance.now() + 350;
        event.preventDefault();
      }, { passive: false });
      renderer.domElement.addEventListener('touchmove', event => {
        if (!pinchActive || event.touches.length !== 2) return;
        const distance = Math.max(1, pinchDistance(event.touches));
        cameraDistance = clampCameraDistance(pinchStartCameraDistance * pinchStartDistance / distance);
        viewTween = null;
        cameraView.distance = selected ? clampCameraDistance(cameraDistance - 6) : cameraDistance;
        suppressTapUntil = performance.now() + 350;
        event.preventDefault();
      }, { passive: false });
      renderer.domElement.addEventListener('touchend', event => {
        if (event.touches.length >= 2) return;
        if (pinchActive) suppressTapUntil = performance.now() + 350;
        pinchActive = false;

      function playSound(name, volume = 1) {
        const buffer = audioBuffers[name];
        if (audioContext && buffer) {
          const source = audioContext.createBufferSource(); // AudioBufferSourceNode（再生ごとに生成して重複可）
          const gain = audioContext.createGain(); // GainNode
          source.buffer = buffer;
          gain.gain.value = volume;
          source.connect(gain).connect(audioContext.destination);
          source.start();
          return;
        }
        const fallback = sounds[name].cloneNode();
        fallback.volume = volume;
        fallback.play().catch(() => {});
      }

          if (t < 1) requestAnimationFrame(step);

      function handleMotion(event) {

          fallback = true;

        if (!acceleration || acceleration.x == null || acceleration.y == null || acceleration.z == null) return;
        const magnitude = Math.hypot(acceleration.x, acceleration.y, acceleration.z);

        let permission = '不要';
        try {
          if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            permission = await DeviceMotionEvent.requestPermission();
          }
          await Promise.allSettled([resumePromise, audioBuffersReady]);
          if (permission !== 'denied' && typeof DeviceMotionEvent !== 'undefined') {
            if (!listening) window.addEventListener('devicemotion', handleMotion);
            listening = true;
            motionStatus.textContent = '・スマホを叩きつけて爆破';
          } else {
            motionStatus.textContent = '・PCはダブルクリックで爆破';
          }
        } catch (error) {
          await Promise.allSettled([resumePromise, audioBuffersReady]);
          motionStatus.textContent = '・ダブルクリックでも爆破できます';
        }
        titleScreen.classList.add('hidden');
        runOpening();
      }
      startButton.addEventListener('click', startExperience);

      const clock = new THREE.Clock();
      function render(now) {
        requestAnimationFrame(render);
        const dt = Math.min(clock.getDelta(), .035);
        const time = now * .001;
        if (viewTween) {
          const progress = Math.min(1, (performance.now() - viewTween.startedAt) / viewTween.duration);
          const eased = progress < .5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          Object.keys(cameraView).forEach(key => {
            cameraView[key] = viewTween.from[key] + (viewTween.to[key] - viewTween.from[key]) * eased;
          });
          if (progress === 1) viewTween = null;
        }
        if (planetTween) {
          const progress = Math.min(1, (performance.now() - planetTween.startedAt) / planetTween.duration);
          const eased = progress < .5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          planet.quaternion.slerpQuaternions(planetTween.from, planetTween.to, eased);
          if (progress === 1) planetTween = null;
        }
        buildings.forEach(building => {
          if (building.userData.buildBorn != null) {
            const buildAge = Math.min(1, (performance.now() - building.userData.buildBorn) / 340);
            const buildBounce = 1 + Math.sin(buildAge * Math.PI * 2.5) * (1 - buildAge) * .18;
            building.scale.setScalar(Math.max(.01, buildAge * buildBounce));
            if (buildAge === 1) building.userData.buildBorn = null;
          }
          if (building === selected && !building.userData.destroyed) {
            building.quaternion.copy(building.userData.baseQuaternion);
            building.rotateZ(Math.sin(time * 18) * .018);
            building.rotateX(Math.sin(time * 22) * .012);
            building.userData.halo.material.opacity = .62 + Math.sin(time * 5) * .25;
          } else {
            building.quaternion.copy(building.userData.baseQuaternion);
          }
          const badge = building.userData.duplicateBadge;
          if (badge && badge.visible) badge.position.y = badge.userData.baseY + Math.sin(time * 3.2 + building.userData.index) * .12;
          const keepDecoration = building.userData.keepDecoration;
          if (keepDecoration && keepDecoration.visible) {
            const keepAge = Math.min(1, (performance.now() - keepDecoration.userData.born) / 560);
            const keepBounce = 1 + Math.sin(keepAge * Math.PI * 3) * (1 - keepAge) * .2;
            keepDecoration.scale.setScalar(Math.max(.01, keepAge * keepBounce));
            keepDecoration.rotation.y = time * .35;
          }
        });
        angryResidents.forEach(resident => {
          if (!resident.visible) return;
          const { phase, basePosition, up, baseQuaternion, mark } = resident.userData;
          const hop = Math.abs(Math.sin(time * 5.2 + phase)) * .14;
          resident.position.copy(basePosition).addScaledVector(up, hop);
          resident.quaternion.copy(baseQuaternion);
          resident.rotateZ(Math.sin(time * 16 + phase) * .09);
          const pulse = 1 + Math.sin(time * 9 + phase) * .18;
          mark.scale.set(.42 * pulse, .42 * pulse, 1);
        });
        for (let i = particles.length - 1; i >= 0; i -= 1) {
          const particle = particles[i];
          particle.life -= dt;
          if (particle.light) particle.light.intensity *= .82;
          if (particle.mesh) {
            particle.velocity.y -= 13 * dt;
            particle.mesh.position.addScaledVector(particle.velocity, dt);
            particle.mesh.rotation.x += particle.spin.x * dt;
            particle.mesh.rotation.y += particle.spin.y * dt;
            particle.mesh.rotation.z += particle.spin.z * dt;
            if (particle.life < .35) particle.mesh.scale.multiplyScalar(.9);
          }
          if (particle.life <= 0) {
            if (particle.mesh) scene.remove(particle.mesh);
            if (particle.light) scene.remove(particle.light);
            particles.splice(i, 1);
          }
        }
        updateCars(time);
        if (treeVisible) {
          const treeAge = Math.min(1, (performance.now() - treeGrowthStarted) / 620);
          const treeBounce = 1 + Math.sin(treeAge * Math.PI * 3) * (1 - treeAge) * .2;
          savingsTree.scale.setScalar(Math.max(.08, treeAge * treeBounce));
        } else {
          savingsTree.scale.setScalar(.01);
        }
        savingsTree.quaternion.copy(savingsTreeBaseQuaternion);
        savingsTree.rotateY(Math.sin(time * 1.15) * .045);
        treePartyCoins.forEach(coin => {
          coin.angle += dt * coin.speed;
          const lift = (time * coin.rise + coin.phase) % 1;
          coin.mesh.position.set(
            Math.cos(coin.angle) * coin.radius,
            .7 + lift * 4.6,
            Math.sin(coin.angle) * coin.radius
          );
          coin.mesh.rotation.x += dt * 7;
          coin.mesh.rotation.y += dt * 10;
        });
        const shakeX = cameraShake > .01 ? (Math.random() - .5) * cameraShake : 0;
        const shakeY = cameraShake > .01 ? (Math.random() - .5) * cameraShake : 0;
        if (cameraShake > .01) cameraShake *= .82;
        camera.position.set(
          cameraView.targetX + isoCameraDirection.x * cameraView.distance + shakeX,
          cameraView.targetY + isoCameraDirection.y * cameraView.distance + shakeY,
          cameraView.targetZ + isoCameraDirection.z * cameraView.distance
        );
        camera.lookAt(cameraView.targetX, cameraView.targetY, cameraView.targetZ);
        // 0幅で初期化された場合(非表示タブ読込等)の自己修復
        if (renderer.domElement.width === 0 && innerWidth > 0) dispatchEvent(new Event('resize'));
        renderer.render(scene, camera);
      }
      requestAnimationFrame(render);

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.fov = camera.aspect < .7 ? 52 : 42;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
      });
    })();
  </script>
</body>
</html>
